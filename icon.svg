<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="18" fill="#0a0c13"/>
  <!-- 4 ascending bars -->
  <rect x="6"  y="74" width="14" height="20" rx="3" fill="#1f9e6e"/>
  <rect x="26" y="60" width="14" height="34" rx="3" fill="#1f9e6e"/>
  <rect x="46" y="46" width="14" height="48" rx="3" fill="#1f9e6e"/>
  <rect x="66" y="32" width="14" height="62" rx="3" fill="#1f9e6e"/>
  <!-- diagonal arrow line (stop short of arrowhead base) -->
  <line x1="10" y1="78" x2="72" y2="20" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <!-- arrowhead pointing upper-right -->
  <polygon points="88,8 65,18 78,31" fill="#ffffff"/>
</svg>
