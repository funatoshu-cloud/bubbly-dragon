<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="18" fill="#0a0c13"/>
  <!-- 4 bars: tops 8 units below arrow line for clear separation -->
  <rect x="5"  y="82" width="14" height="12" rx="3" fill="#1f9e6e"/>
  <rect x="25" y="54" width="14" height="40" rx="3" fill="#1f9e6e"/>
  <rect x="45" y="65" width="14" height="29" rx="3" fill="#1f9e6e"/>
  <rect x="65" y="32" width="14" height="62" rx="3" fill="#1f9e6e"/>
  <!-- zigzag arrow: up → dip → up to arrowhead -->
  <polyline points="8,77 32,44 52,56 72,22" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arrowhead at top-right pointing ~45° up-right -->
  <polygon points="87,8 74,14 81,24" fill="#ffffff"/>
</svg>
