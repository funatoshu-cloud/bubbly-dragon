<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WealthTrack</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<meta name="theme-color" content="#090c13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WealthTrack">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #090c13;
  --surface: #0f1520;
  --surface2: #161e2c;
  --border: rgba(255,255,255,0.07);
  --text: #dde4ee;
  --muted: #6b7888;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --blue: #58a6ff;
  --purple: #bc8cff;
  /* Tier colors — single source of truth for badges, donut, legend */
  --tier-t0: #58a6ff;
  --tier-t1: #3fb950;
  --tier-t2: #d29922;
  --tier-t3a: #bc8cff;
  --tier-t3b: #f0883e;
  --tier-t4: #8b949e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; font-size: 13px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--blue); }

/* Layout */
.container { max-width: 1280px; margin: 0 auto; padding: 12px 16px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
.card-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 6px; }
.card-value { font-size: 20px; font-weight: 700; }
.card-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }

/* Header */
.header { background: var(--surface); border: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; border-radius: 8px; }
.header-title { font-size: 15px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 7px; }
.header-title img { width: 26px; height: 26px; flex-shrink: 0; border-radius: 6px; }
.header-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; font-size: 11px; color: var(--muted); }
.btn { background: var(--green); border: none; color: #fff; border-radius: 5px; padding: 5px 12px; cursor: pointer; font-size: 11px; font-weight: 700; letter-spacing: .04em; }
.btn:hover { opacity: .85; }
.btn:disabled { opacity: .4; cursor: default; }

/* Section titles */
h2 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 18px 0 8px; border-left: 2px solid var(--blue); padding-left: 8px; }

/* Tier table */
.tier-table { width: 100%; border-collapse: collapse; }
.tier-table th { text-align: left; padding: 7px 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border-bottom: 1px solid var(--border); }
.tier-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
.tier-table tfoot td { border-bottom: none; border-top: 1px solid var(--border); font-weight: 700; }
.tier-table tbody tr:hover td { background: var(--surface2); }
.tier-badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: 700; letter-spacing: .04em; }
.t0 { background:#0c1e2e; color:var(--tier-t0); }
.t1 { background:#0c2018; color:var(--tier-t1); }
.t2 { background:#261a08; color:var(--tier-t2); }
.t3a { background:#1a1028; color:var(--tier-t3a); }
.t3b { background:#240e14; color:var(--tier-t3b); }
.t4 { background:#151a22; color:var(--tier-t4); }
.pct-bar-wrap { display: flex; align-items: center; }
.pct-bar { height: 3px; border-radius: 2px; background: var(--blue); flex-shrink: 0; opacity: .6; }

/* History chart */
.hchart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 16px 12px; margin-bottom: 10px; position: relative; }
.hchart-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; flex-wrap: wrap; gap: 8px; }
.hchart-val { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.hchart-delta { font-size: 13px; font-weight: 600; margin-left: 10px; }
.hchart-periods { display: flex; gap: 4px; }
.hchart-period { background: none; border: none; color: var(--muted); font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; cursor: pointer; letter-spacing: .04em; }
.hchart-period.active { background: var(--surface2); color: var(--text); }
.hchart-svg { display: block; width: 100%; overflow: visible; }
.hchart-tip { display:none; position:absolute; background:#161e2c; border:1px solid rgba(255,255,255,0.12); border-radius:6px; padding:7px 10px; font-size:12px; color:#dde4ee; pointer-events:none; white-space:nowrap; z-index:20; box-shadow:0 4px 16px rgba(0,0,0,0.5); }

/* Leverage */
.lev-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.lev-header h2 { margin-bottom: 0; }
.lev-income { font-size: 11px; color: var(--muted); }
.leverage-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
.lev-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
.lev-title { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.lev-eq { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
.lev-body { display: flex; align-items: flex-end; justify-content: space-between; }
.lev-actual { font-size: 20px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.lev-target-col { text-align: right; }
.lev-target-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 2px; }
.lev-target-val { font-size: 14px; font-weight: 700; line-height: 1; }
.lev-green { color: var(--green); }
.lev-yellow { color: var(--yellow); }
.lev-red { color: var(--red); }
.lev-tint-green  { background: linear-gradient(135deg, var(--surface), rgba(63,185,80,0.09)); border-color: rgba(63,185,80,0.28); }
.lev-tint-yellow { background: linear-gradient(135deg, var(--surface), rgba(210,153,34,0.09)); border-color: rgba(210,153,34,0.28); }
.lev-tint-red    { background: linear-gradient(135deg, var(--surface), rgba(248,81,73,0.09));  border-color: rgba(248,81,73,0.28); }
.ok { color: var(--green); }
.warn { color: var(--yellow); }
.bad { color: var(--red); }

/* Consistent font across all SVG charts */
svg text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }

/* Savings rate */
.sr-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:14px 16px; margin-bottom:10px; }
.sr-rate { font-size:34px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; }
.sr-sub  { font-size:11px; color:var(--muted); margin-top:4px; }
.sr-bar-track { height:4px; background:rgba(255,255,255,0.07); border-radius:2px; margin-top:12px; overflow:hidden; }
.sr-bar-fill  { height:100%; border-radius:2px; transition:width .4s ease; }
.sr-commitment-row { display:flex; align-items:center; gap:8px; margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.05); flex-wrap:wrap; }
.sr-commitment-label { font-size:11px; color:var(--muted); }
.sr-commitment-value { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }
.sr-commitment-note { font-size:10px; color:var(--muted); margin-left:auto; }

/* MoM Snapshot */
.ai-mom { background:var(--surface2); border-radius:6px; padding:10px 12px; margin-bottom:0; }
.ai-mom-header { display:flex; align-items:baseline; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
.ai-mom-month { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
.ai-mom-total { font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; }
.ai-mom-pct { font-size:12px; color:var(--muted); }
.ai-mom-bar-track { height:4px; background:rgba(255,255,255,0.06); border-radius:2px; margin-bottom:10px; overflow:hidden; display:flex; }
.ai-mom-bar-seg { height:100%; }
.ai-mom-drivers { display:flex; flex-direction:column; gap:3px; }
.ai-mom-row { display:flex; align-items:center; gap:8px; font-size:12px; }
.ai-mom-row.sub { padding-left:16px; font-size:11px; }
.ai-mom-dot { width:8px; height:8px; border-radius:2px; flex-shrink:0; }
.ai-mom-name { flex:1; color:var(--muted); }
.ai-mom-val { font-variant-numeric:tabular-nums; min-width:80px; text-align:right; }
.ai-mom-pct-col { font-size:10px; color:var(--muted); min-width:36px; text-align:right; }
.ai-mom-badge { font-size:9px; font-weight:700; padding:1px 5px; border-radius:3px; background:rgba(255,255,255,0.06); color:var(--muted); border:1px solid var(--border); flex-shrink:0; }

/* AI Summary */
.ai-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:10px; }
.ai-text { font-size:13px; line-height:1.75; color:var(--text); }
.ai-section-head { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--blue); margin:14px 0 6px; border-left:2px solid var(--blue); padding-left:8px; }
.ai-section-head:first-child { margin-top:0; }
.ai-list { margin:4px 0 4px 16px; padding:0; }
.ai-list li { margin-bottom:4px; }
.ai-para { margin:0 0 4px; }
.ai-placeholder { font-size:12px; color:var(--muted); font-style:italic; }
.ai-footer { display:flex; align-items:center; justify-content:space-between; margin-top:14px; flex-wrap:wrap; gap:8px; border-top:1px solid var(--border); padding-top:10px; }
.ai-ts { font-size:11px; color:var(--muted); }
.ai-setup { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:12px 14px; font-size:12px; line-height:1.6; color:var(--muted); }
.ai-setup code { background:rgba(255,255,255,0.06); border-radius:3px; padding:1px 5px; font-family:monospace; color:var(--text); font-size:11px; }
/* AI feedback buttons */
.ai-action-item { list-style:none; padding:5px 0; border-bottom:1px solid rgba(255,255,255,0.04); }
.ai-action-item:last-child { border-bottom:none; }
.ai-action-row { display:flex; align-items:flex-start; gap:10px; }
.ai-action-text { flex:1; font-size:13px; line-height:1.5; }
.ai-action-text.done { text-decoration:line-through; color:var(--green); opacity:0.75; }
.ai-action-text.skip { text-decoration:line-through; color:var(--muted); opacity:0.6; }
.ai-action-btns { display:flex; gap:4px; flex-shrink:0; padding-top:1px; }
.ai-fb-btn { background:none; border:1px solid var(--border); border-radius:4px; color:var(--muted); font-size:11px; padding:2px 8px; cursor:pointer; transition:background .15s,color .15s,border-color .15s; }
.ai-fb-btn:hover { border-color:rgba(255,255,255,0.2); color:var(--text); }
.ai-fb-btn.active-done { background:rgba(63,185,80,0.15); border-color:var(--green); color:var(--green); }
.ai-fb-btn.active-skip { background:rgba(255,255,255,0.06); border-color:var(--muted); color:var(--muted); }
.ai-fb-btn.active-note { background:rgba(88,166,255,0.12); border-color:var(--blue); color:var(--blue); }
.ai-note-area { margin-top:5px; }
.ai-note-input { background:var(--surface2); border:1px solid var(--border); border-radius:4px; color:var(--text); padding:5px 8px; font-size:12px; width:100%; font-family:inherit; box-sizing:border-box; }

/* FIRE progress bar */
.fire-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:14px 16px; margin-bottom:10px; }
.fire-header { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
.fire-pct { font-size:24px; font-weight:700; font-variant-numeric:tabular-nums; }
.fire-meta { font-size:11px; color:var(--muted); }
.fire-track { height:8px; background:var(--surface2); border-radius:4px; overflow:hidden; margin-bottom:8px; }
.fire-fill { height:100%; border-radius:4px; transition:width .4s ease; }
.fire-labels { position:relative; font-size:10px; color:var(--muted); height:16px; }
.fire-milestone { position:absolute; top:0; height:100%; border-left:2px dashed rgba(255,255,255,0.2); }
.fire-swr { margin-top:12px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.06); }
.fire-swr-title { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:6px; }
.fire-swr-row { display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:12px; padding:3px 0; flex-wrap:wrap; }
.fire-swr-label { color:var(--muted); }
.fire-swr-vals { font-variant-numeric:tabular-nums; font-weight:600; }
.fire-swr-vals .sep { color:var(--muted); margin:0 6px; font-weight:400; }

/* Waterfall chart */
.wfall-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:16px 16px 12px; margin-bottom:10px; position:relative; }
.wfall-legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; }
.wfall-legend-item { display:flex; align-items:center; gap:5px; font-size:10px; color:var(--muted); }
.wfall-legend-dot { width:10px; height:10px; border-radius:2px; flex-shrink:0; }
.wfall-tip { display:none; position:absolute; background:#161e2c; border:1px solid rgba(255,255,255,0.12); border-radius:6px; padding:8px 11px; font-size:12px; color:#dde4ee; pointer-events:none; white-space:nowrap; z-index:20; box-shadow:0 4px 16px rgba(0,0,0,0.5); }

/* Mortgage simulator */
.msim-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:16px; }
.msim-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px; }
.msim-stat { background:var(--surface2); border-radius:6px; padding:10px 12px; }
.msim-stat-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-bottom:4px; }
.msim-stat-val { font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; }
.msim-slider-row { display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
.msim-slider { flex:1; min-width:120px; accent-color:var(--blue); }
.msim-slider-label { font-size:12px; color:var(--muted); white-space:nowrap; }
.msim-slider-val { font-size:14px; font-weight:700; color:var(--blue); min-width:80px; text-align:right; }
.msim-result { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
.msim-result-item { background:var(--surface2); border-radius:6px; padding:10px 12px; text-align:center; }
.msim-result-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-bottom:5px; }
.msim-result-val { font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; }

/* Scorecard table */
.sc-table { width: 100%; border-collapse: collapse; }
.sc-table th { text-align: left; padding: 7px 14px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border-bottom: 1px solid var(--border); }
.sc-table th:nth-child(2), .sc-table th:nth-child(3) { text-align: right; }
.sc-table td { padding: 9px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
.sc-table td:nth-child(2), .sc-table td:nth-child(3) { text-align: right; font-variant-numeric: tabular-nums; }
.sc-table tbody tr:not(.sc-section):last-child td { border-bottom: none; }
.sc-table tbody tr:not(.sc-section):hover td { background: var(--surface2); }
.sc-section td { padding: 4px 14px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--yellow); background: var(--surface2); border-bottom: 1px solid var(--border); }
.sc-green { color: var(--green) !important; font-weight: 700; }
.sc-yellow { color: var(--yellow) !important; font-weight: 700; }
.sc-red { color: var(--red) !important; font-weight: 700; }

/* Holdings table */
.holdings-wrap { overflow-x: auto; }
.holdings-table { width: 100%; border-collapse: collapse; white-space: nowrap; }
.holdings-table th { text-align: right; padding: 7px 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
.holdings-table th:first-child, .holdings-table th:nth-child(2) { text-align: left; }
.holdings-table th:hover { color: var(--text); }
.holdings-table th.sort-asc::after { content: ' ↑'; }
.holdings-table th.sort-desc::after { content: ' ↓'; }
.holdings-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); text-align: right; font-variant-numeric: tabular-nums; }
.holdings-table td:first-child, .holdings-table td:nth-child(2) { text-align: left; }
.holdings-table tr:hover td { background: var(--surface2); }
.holdings-table tfoot td { font-weight: 700; border-top: 1px solid var(--border); border-bottom: none; }
.gain { color: var(--green); }
.loss { color: var(--red); }
.neutral { color: var(--muted); }

/* Sector bars */
.sector-row { display: flex; align-items: center; gap: 12px; margin-bottom: 7px; }
.sector-name { width: 176px; flex-shrink: 0; font-size: 12px; }
.sector-bar-bg { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.sector-bar-fill { height: 100%; border-radius: 3px; transition: width .3s; }
.sector-pct { width: 38px; text-align: right; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Progress */
.progress-wrap { margin-top: 6px; }
.progress-bg { height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width .4s; }

/* Top metrics row 1 */
.top-metrics { display: grid; grid-template-columns: repeat(6,1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
.top-metric { background: var(--surface); padding: 10px 14px; }
.top-metric-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-metric-value { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; }

/* Equation row */

/* Loading / error */
#loading { text-align: center; padding: 60px; color: var(--muted); }
.error-box { background: #2d1a1a; border: 1px solid var(--red); border-radius: 8px; padding: 14px; color: var(--red); margin: 14px 0; }

/* Tab switcher */
.tabs { display:flex; gap:2px; background:var(--surface2); border-radius:6px; padding:3px; }
.tab { padding:5px 16px; border-radius:4px; font-size:12px; font-weight:600; cursor:pointer; border:none; background:transparent; color:var(--muted); letter-spacing:.02em; transition:background .15s,color .15s; }
.tab.active { background:var(--surface); color:var(--text); }

/* Projection panel */
.proj-warning { border-radius:6px; padding:10px 14px; font-size:12px; margin-bottom:12px; border:1px solid; }
.proj-warning.red { background:rgba(248,81,73,.1); border-color:var(--red); color:var(--red); }
.proj-warning.yellow { background:rgba(210,153,34,.1); border-color:var(--yellow); color:var(--yellow); }
.proj-inputs { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px; }
.proj-group { display:flex; flex-direction:column; gap:5px; min-width:140px; }
.proj-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
.proj-select,.proj-number { background:var(--surface2); border:1px solid var(--border); border-radius:5px; color:var(--text); padding:5px 10px; font-size:13px; }
.proj-select { min-width:160px; } .proj-number { width:150px; }
input[type=range] { accent-color:var(--blue); width:180px; cursor:pointer; }
.proj-table { width:100%; border-collapse:collapse; }
.proj-table th { text-align:right; padding:6px 12px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); border-bottom:1px solid var(--border); }
.proj-table th:first-child { text-align:left; }
.proj-table td { padding:8px 12px; border-bottom:1px solid var(--border); text-align:right; font-variant-numeric:tabular-nums; font-size:13px; }
.proj-table td:first-child { text-align:left; }
.proj-table tfoot td { font-weight:700; border-top:1px solid var(--border); border-bottom:none; }
.manual-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(185px,1fr)); gap:8px; margin-bottom:14px; }
.manual-card { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:10px 12px; }
/* Rate assumptions table */

<body>
<div class="container">
  <div id="loading">データ読み込み中...</div>
  <div id="dashboard" style="display:none"></div>
</div>

<script>
// ── Data sources ──────────────────────────────────────────────────────────────
const CLEAN_URL     = 'https://docs.google.com/spreadsheets/d/1j9az4y9uJ_hVbgFFeps7odLkMfHb6Iyi4Cl2LTcYGbU/export?format=csv&gid=1838261664';
const PORTFOLIO_URL = 'https://docs.google.com/spreadsheets/d/1j9az4y9uJ_hVbgFFeps7odLkMfHb6Iyi4Cl2LTcYGbU/export?format=csv&gid=2040776062';
const HISTORY_URL   = 'https://docs.google.com/spreadsheets/d/1j9az4y9uJ_hVbgFFeps7odLkMfHb6Iyi4Cl2LTcYGbU/export?format=csv&gid=58449373';

// History column indices (0=date, then per schema)
const HCOL = { t1_index_value:1,t1_index_cost:2,t2_value:3,t2_cost:4,t3a_ideco_value:5,t3a_ideco_cost:6,t4_land:7,t4_building:8,t4_mortgage:9,t0_value:10,t1_gold:11,t1_hysa:12,t3a_insurance:13,t3b_value:14,passive_income:15 };
const MONTHLY_COLS = ['t0_value','t1_gold','t1_hysa','t3a_insurance','t3b_value','passive_income'];
let _history = [];

function parseHistory(rows) {
  const data = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r || !r[0]) continue;
    const entry = { date: new Date(r[0]) };
    for (const [col, idx] of Object.entries(HCOL)) {
      const v = r[idx] ? parseFloat(String(r[idx]).replace(/[¥,%x,]/g,'')) : null;
      entry[col] = (v !== null && !isNaN(v)) ? v : null;
    }
    data.push(entry);
  }
  // Forward-fill monthly columns
  for (const col of MONTHLY_COLS) {
    let last = null;
    for (const row of data) { if (row[col] !== null) last = row[col]; else row[col] = last; }
  }
  return data;
}

function arrMedian(arr) {
  if (!arr.length) return 0;
  const s = [...arr].sort((a,b)=>a-b), m = Math.floor(s.length/2);
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2;
}
function arrStddev(arr) {
  if (arr.length < 2) return 0;
  const mean = arr.reduce((s,v)=>s+v,0)/arr.length;
  return Math.sqrt(arr.reduce((s,v)=>s+(v-mean)**2,0)/(arr.length-1));
}

// Rate caps — bound annualBase and annualSigma so projections stay realistic and projectBucket math stays safe
const RATE_CAP = { base: 0.25, sigma: 0.25 };  // ±25% annual base, ≤25% σ
function clampRate(r, cap) {
  if (!isFinite(r)) return { v: 0, clamped: true };
  const c = Math.max(-cap, Math.min(cap, r));
  return { v: c, clamped: c !== r };
}

// Value caps — per-bucket floor as fraction of total invested capital, and shared ceiling growth rate
// Floor reflects historic worst-case real drawdowns; ceiling caps best-case compound growth at 12%/yr
const FLOOR_MULT = {
  t0:            0.95,  // cash — minor FX/inflation risk only
  t1_index:      0.50,  // diversified equities — historic ~50% max drawdown
  t1_gold:       0.65,  // gold — ~35% historic drawdowns
  t1_hysa:       0.98,  // HYSA — effectively guaranteed
  t2:            0.50,  // individual stocks — same as index
  t3a_ideco:     0.55,  // locked retirement diversified — slightly more conservative
  t3a_insurance: 0.90,  // insurance — usually has guaranteed minimum
  t3b:           0.60,  // 529 / education — typically conservative allocation
  t4:            null,  // T4 handled separately (mortgage paydown model)
};
const CEIL_ANNUAL = 0.12;  // best-case compound rate ceiling — matches best historic decades

function applyValueCap(projectedVal, currentVal, monthlyContrib, months, stopMonths, key, mode) {
  const capitalIn = currentVal + monthlyContrib * Math.min(months, stopMonths);
  if (capitalIn <= 0) return projectedVal;
  if (mode === 'down') {  // pessimistic or stress — apply floor
    const f = FLOOR_MULT[key];
    if (f == null) return projectedVal;
    return Math.max(projectedVal, capitalIn * f);
  }
  if (mode === 'up') {  // optimistic — apply ceiling
    const ceilFV = capitalIn * Math.pow(1 + CEIL_ANNUAL, months / 12);
    return Math.min(projectedVal, ceilFV);
  }
  return projectedVal;
}

// Time-weighted return helper — chains sub-period returns geometrically,
// annualizes via Math.pow(TWR, 365/days), then shrinks toward zero when
// history is short so noise doesn't extrapolate to absurd annual rates.
//
// Why TWR instead of arrMedian × 252:
//   - Median × 252 was wildly unstable: 1 slightly-positive median day → 100%+/yr
//   - TWR uses ACTUAL elapsed time, not "if every day looked like the median"
//   - Outlier filter on per-period returns catches contributions misclassified as returns
//   - Shrinkage prevents 30 days of data from claiming to predict 1 full year
function bucketRate(history, vCol, cCol, perPeriodCap, annDays) {
  const subReturns=[];
  let firstDate=null, lastDate=null, twr=1, pv=null, pc=null;
  for (const row of history) {
    const v=row[vCol];
    if (v===null) continue;
    const c=cCol ? (row[cCol]??0) : 0;
    if (pv!==null && pv>0 && v!==pv) {
      // Pure return ratio: cost-tracked excludes contributions, no-cost includes them
      const ret = cCol ? ((v-c)-(pv-pc))/pv : (v-pv)/pv;
      // Per-period cap: anything bigger is a contribution/withdrawal/data error, not a return
      if (isFinite(ret) && Math.abs(ret)<=perPeriodCap) {
        twr*=(1+ret);
        subReturns.push(ret);
      }
    }
    if (firstDate===null) firstDate=row.date;
    lastDate=row.date;
    pv=v; pc=c;
  }
  if (firstDate===null || subReturns.length<2) return { annualBase:0, annualSigma:0 };
  const days=Math.max(1,(lastDate-firstDate)/(1000*60*60*24));
  let annualBase=Math.pow(twr, 365/days)-1;
  // Shrink toward 0 when history < 180 days (uncertain extrapolation)
  const shrinkFactor=Math.min(1, days/180);
  annualBase*=shrinkFactor;
  const annualSigma=arrStddev(subReturns)*Math.sqrt(annDays);
  return { annualBase, annualSigma };
}

function computeRates(history) {
  if (history.length < 2) return null;
  const rates = {};
  const last = history[history.length-1];

  // Investment buckets: daily value + cost tracking
  // perPeriodCap=5% (typical max legitimate single-day move), annDays=252 trading days
  for (const [key, vCol, cCol] of [['t1_index','t1_index_value','t1_index_cost'],['t2','t2_value','t2_cost'],['t3a_ideco','t3a_ideco_value','t3a_ideco_cost']]) {
    const r=bucketRate(history, vCol, cCol, 0.05, 252);
    // Monthly contributions — track Δcost when month rolls over and cost increased
    const monthlyContribs=[];
    let pm=null, pc=null;
    for (const row of history) {
      const c=row[cCol];
      const rm=row.date.getFullYear()*12+row.date.getMonth();
      if (pm!==null && rm!==pm && pc!==null && c!==null && c>pc) monthlyContribs.push(c-pc);
      if (c!==null) pc=c; pm=rm;
    }
    const b=clampRate(r.annualBase, RATE_CAP.base);
    const s=clampRate(r.annualSigma, RATE_CAP.sigma);
    rates[key]={ annualBase:b.v, annualSigma:s.v, _baseClamped:b.clamped, _sigmaClamped:s.clamped, monthlyContrib:arrMedian(monthlyContribs)||0, currentValue:last[vCol]||0 };
  }

  // T4: separate property appreciation from mortgage paydown
  const mortDeltas=[];
  for (let i=1;i<history.length;i++) { const d=history[i].t4_mortgage-history[i-1].t4_mortgage; if(d<0) mortDeltas.push(Math.abs(d)); }
  let typicalPmt=arrMedian(mortDeltas)||0;
  if (typicalPmt < 1000 && (last.t4_mortgage||0) > 0) {
    const mr=MORTGAGE_RATE/12, n=MORTGAGE_TERM_YEARS*12, bal=last.t4_mortgage;
    const fullPmt=bal*mr/(1-Math.pow(1+mr,-n));
    typicalPmt=fullPmt-bal*mr;
  }
  // T4 property appreciation — TWR over land+building, no contributions
  // perPeriodCap=5% (property doesn't move >5% in a single day), annDays=365 calendar
  const t4History=history.map(r => ({
    date: r.date,
    _t4_prop: (r.t4_land!==null && r.t4_building!==null) ? r.t4_land+r.t4_building : null
  }));
  const t4r=bucketRate(t4History, '_t4_prop', null, 0.05, 365);
  const _paydownStartOffset=Math.max(0,Math.round((new Date('2026-06-01')-new Date())/(1000*60*60*24*30.44)));
  const _propValue=(last.t4_land||0)+(last.t4_building||0);
  const t4b=clampRate(t4r.annualBase, RATE_CAP.base);
  const t4s=clampRate(t4r.annualSigma, RATE_CAP.sigma);
  rates.t4={ annualBase:t4b.v, annualSigma:t4s.v, _baseClamped:t4b.clamped, _sigmaClamped:t4s.clamped, monthlyContrib:typicalPmt, currentValue:_propValue-(last.t4_mortgage||0), _propertyValue:_propValue, _mortgageBalance:last.t4_mortgage||0, _monthlyPaydown:typicalPmt, _paydownStartOffset };

  // No-cost buckets — forward-filled monthly cadence (changes only on first-of-month)
  // perPeriodCap=15% per period catches normal monthly changes but flags contribution-sized jumps
  // annDays=12 because effective sampling is monthly
  // Note: contributions/withdrawals to t0/HYSA still get treated as "returns" since there's no
  // cost tracking — the 15% cap helps but doesn't perfectly separate them
  for (const [key,col] of [['t0','t0_value'],['t1_hysa','t1_hysa'],['t1_gold','t1_gold'],['t3a_insurance','t3a_insurance'],['t3b','t3b_value']]) {
    const r=bucketRate(history, col, null, 0.15, 12);
    const b=clampRate(r.annualBase, RATE_CAP.base);
    const s=clampRate(r.annualSigma, RATE_CAP.sigma);
    rates[key]={ annualBase:b.v, annualSigma:s.v, _baseClamped:b.clamped, _sigmaClamped:s.clamped, monthlyContrib:0, currentValue:last[col]||0 };
  }
  return rates;
}

function projectBucket(currentVal, monthlyContrib, annualRate, months) {
  // Safety floor: prevents r ≤ -1 from sign-flipping Math.pow output
  const safeAnnual=Math.max(-0.50, annualRate);
  const r=safeAnnual/12;
  if(Math.abs(r)<0.000001) return currentVal+monthlyContrib*months;
  const g=Math.pow(1+r,months);
  return currentVal*g+monthlyContrib*(g-1)/r;
}

// Stress test: simulate an immediate -30% drop on investment buckets in month 0, then recover at base rate
const SHOCK_BUCKETS = new Set(['t1_index','t2','t3a_ideco']);
const SHOCK = 0.70;  // -30%

function buildProjection(rates, months, stopMonths) {
  const KEYS=['t1_index','t2','t3a_ideco','t4','t0','t1_hysa','t1_gold','t3a_insurance','t3b'];
  const result=[];
  for(let m=0;m<=months;m++){
    let base=0,opt=0,pess=0,stress=0;
    for(const key of KEYS){
      const r=rates[key]; if(!r) continue;
      // Linear mortgage paydown for RE-excluded mode
      if(r._isLinearPaydown){
        const fv=Math.min(0, r.currentValue + m * r._monthlyPaydown);
        base+=fv; opt+=fv; pess+=fv; stress+=fv; continue;
      }
      // T4: split property appreciation (compounding on full property value) from
      // mortgage paydown (fixed monthly principal, linear, starting _paydownStartOffset)
      if(key==='t4' && r._propertyValue!==undefined){
        const payMo=Math.max(0, m-(r._paydownStartOffset||0));
        const mortFV=Math.max(0, r._mortgageBalance - r.monthlyContrib*payMo);
        const t4Base=projectBucket(r._propertyValue,0,r.annualBase,              m)-mortFV;
        const t4Opt =projectBucket(r._propertyValue,0,r.annualBase+r.annualSigma,m)-mortFV;
        const t4Pess=projectBucket(r._propertyValue,0,r.annualBase-r.annualSigma,m)-mortFV;
        base+=t4Base; opt+=t4Opt; pess+=t4Pess; stress+=t4Base;
        continue;
      }
      const contrib = (m <= stopMonths) ? r.monthlyContrib : 0;
      // Base — no value cap (median rate is inherently reasonable)
      base +=projectBucket(r.currentValue,contrib,r.annualBase,m);
      // Optimistic — ceiling cap
      const optRaw=projectBucket(r.currentValue,contrib,r.annualBase+r.annualSigma,m);
      opt  +=applyValueCap(optRaw, r.currentValue, contrib, m, stopMonths, key, 'up');
      // Pessimistic — floor cap
      const pessRaw=projectBucket(r.currentValue,contrib,r.annualBase-r.annualSigma,m);
      pess +=applyValueCap(pessRaw, r.currentValue, contrib, m, stopMonths, key, 'down');
      // Stress — shock starting value on investment buckets, base-rate compounding, floor cap
      const stressStart = SHOCK_BUCKETS.has(key) ? r.currentValue * SHOCK : r.currentValue;
      const stressRaw=projectBucket(stressStart,contrib,r.annualBase,m);
      stress +=applyValueCap(stressRaw, stressStart, contrib, m, stopMonths, key, 'down');
    }
    result.push({month:m,base,optimistic:opt,pessimistic:pess,stress});
  }
  return result;
}

function buildChart(projData, currentNW, targetNW, coastNW) {
  const W=800,H=320,PL=72,PR=20,PT=10,PB=36;
  const cW=W-PL-PR, cH=H-PT-PB;
  const months=projData[projData.length-1].month;
  const hasStress=projData[0].stress!==undefined;
  const allV=projData.flatMap(p=>hasStress?[p.base,p.optimistic,p.pessimistic,p.stress]:[p.base,p.optimistic,p.pessimistic]);
  if(targetNW) allV.push(targetNW);
  const rawMin=Math.min(...allV), rawMax=Math.max(...allV);
  const pad=(rawMax-rawMin)*0.04||Math.abs(rawMax||rawMin)*0.04||1e6;
  const minV=rawMin-pad, maxV=rawMax+pad;
  const xs=m=>PL+(m/months)*cW, ys=v=>PT+(1-(v-minV)/(maxV-minV))*cH;

  const line=(key,color,dash='')=>{
    const d=projData.map(p=>`${xs(p.month).toFixed(1)},${ys(p[key]).toFixed(1)}`).join(' ');
    return `<polyline points="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"${dash?` stroke-dasharray="${dash}"`:''}/>`;
  };
  const bandPts=[...projData.map(p=>`${xs(p.month).toFixed(1)},${ys(p.optimistic).toFixed(1)}`),
                 ...[...projData].reverse().map(p=>`${xs(p.month).toFixed(1)},${ys(p.pessimistic).toFixed(1)}`)].join(' ');

  let grid='',yLbl='';
  for(let i=0;i<=5;i++){
    const v=minV+(maxV-minV)*(i/5), y=ys(v).toFixed(1);
    grid+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="rgba(255,255,255,0.05)"/>`;
    yLbl+=`<text x="${PL-6}" y="${y}" text-anchor="end" dominant-baseline="middle" fill="#6b7888" font-size="10">${(v/1000000).toFixed(0)}M</text>`;
  }
  let xLbl='';
  const totalYrs=Math.floor(months/12);
  for(let yr=0;yr<=totalYrs;yr++){
    const x=xs(yr*12);
    const isFirst=yr===0, isLast=yr===totalYrs;
    const anchor=isFirst?'start':isLast?'end':'middle';
    const lx=isFirst?x+2:isLast?x-2:x;
    xLbl+=`<text x="${lx.toFixed(1)}" y="${H-PB+14}" text-anchor="${anchor}" fill="#6b7888" font-size="10">${yr===0?'Now':yr+'yr'}</text>`;
    if(yr>0) grid+=`<line x1="${x.toFixed(1)}" y1="${PT}" x2="${x.toFixed(1)}" y2="${H-PB}" stroke="rgba(255,255,255,0.04)"/>`;
  }
  let zeroLine='';
  if(minV<0&&maxV>0){const y0=ys(0).toFixed(1);zeroLine=`<line x1="${PL}" y1="${y0}" x2="${W-PR}" y2="${y0}" stroke="rgba(255,255,255,0.25)" stroke-width="1"/><text x="${PL-6}" y="${y0}" text-anchor="end" dominant-baseline="middle" fill="rgba(255,255,255,0.35)" font-size="10">0</text>`;}
  const todayLine=`<line x1="${PL}" y1="${PT}" x2="${PL}" y2="${H-PB}" stroke="rgba(255,255,255,0.2)" stroke-dasharray="3,3"/>`;
  let targetLine='';
  if(targetNW&&targetNW>minV&&targetNW<maxV){
    const yT=ys(targetNW).toFixed(1);
    targetLine=`<line x1="${PL}" y1="${yT}" x2="${W-PR}" y2="${yT}" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4,4"/><text x="${W-PR+4}" y="${yT}" dominant-baseline="middle" fill="#58a6ff" font-size="9">Target</text>`;
  }
  // Coast FIRE curve
  let coastLine='';
  if(coastNW&&coastNW.length&&coastNW[0]>minV){
    const coastPts=coastNW.map((v,m)=>v>=minV&&v<=maxV*1.1?`${xs(m).toFixed(1)},${ys(Math.min(v,maxV)).toFixed(1)}`:null).filter(Boolean).join(' ');
    if(coastPts) coastLine=`<polyline points="${coastPts}" fill="none" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="6,3"/>`;
    const lastVisible=coastNW.reduce((acc,v,m)=>v>=minV&&v<=maxV*1.1?m:acc,-1);
    if(lastVisible>0){const lx=xs(lastVisible),isRight=lx>W*0.75;coastLine+=`<text x="${(isRight?lx-2:lx).toFixed(1)}" y="${(ys(coastNW[lastVisible])-6).toFixed(1)}" text-anchor="${isRight?'end':'middle'}" fill="#f0883e" font-size="9">Coast FIRE</text>`;}
  }

  const hairline=`<line id="chartHairline" x1="${PL}" y1="${PT}" x2="${PL}" y2="${H-PB}" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="3,2" pointer-events="none" visibility="hidden"/>`;
  const dots=`<circle id="chartDotOpt" r="4" fill="rgba(63,185,80,0.85)" stroke="#0a0c13" stroke-width="2" pointer-events="none" visibility="hidden"/>
  <circle id="chartDotBase" r="4" fill="#58a6ff" stroke="#0a0c13" stroke-width="2" pointer-events="none" visibility="hidden"/>
  <circle id="chartDotPess" r="4" fill="rgba(248,81,73,0.85)" stroke="#0a0c13" stroke-width="2" pointer-events="none" visibility="hidden"/>
  ${hasStress?`<circle id="chartDotStress" r="4" fill="rgba(139,148,158,0.85)" stroke="#0a0c13" stroke-width="2" pointer-events="none" visibility="hidden"/>`:''}`;
  const overlay=`<rect id="chartOverlay" x="${PL}" y="${PT}" width="${cW}" height="${cH}" fill="transparent" style="cursor:crosshair;touch-action:none"/>`;

  return `<svg id="projSvg" viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible">
  ${grid}${yLbl}${xLbl}${zeroLine}${todayLine}${targetLine}${coastLine}
  <polygon points="${bandPts}" fill="rgba(88,166,255,0.07)"/>
  ${hasStress?line('stress','rgba(139,148,158,0.7)','2,3'):''}
  ${line('pessimistic','rgba(248,81,73,0.7)','5,4')}
  ${line('optimistic','rgba(63,185,80,0.7)','5,4')}
  ${line('base','#58a6ff')}
  <circle cx="${xs(0).toFixed(1)}" cy="${ys(currentNW).toFixed(1)}" r="5" fill="#58a6ff" stroke="#090c13" stroke-width="2"/>
  ${hairline}${dots}${overlay}
  </svg>`;
}

function setupChartInteraction(projData) {
  const W=800,H=320,PL=72,PR=20,PT=10,PB=36;
  const cW=W-PL-PR, cH=H-PT-PB;
  const maxM=projData[projData.length-1].month;
  const hasStress=projData[0].stress!==undefined;
  const allV=projData.flatMap(p=>hasStress?[p.base,p.optimistic,p.pessimistic,p.stress]:[p.base,p.optimistic,p.pessimistic]);
  const rawMin=Math.min(...allV), rawMax=Math.max(...allV);
  const pad=(rawMax-rawMin)*0.04||Math.abs(rawMax||rawMin)*0.04||1e6;
  const minV=rawMin-pad, maxV=rawMax+pad;
  const xs=m=>PL+(m/maxM)*cW;
  const ys=v=>PT+(1-(v-minV)/(maxV-minV))*cH;

  const svg=document.getElementById('projSvg');
  const ov=document.getElementById('chartOverlay');
  const hl=document.getElementById('chartHairline');
  const dO=document.getElementById('chartDotOpt');
  const dB=document.getElementById('chartDotBase');
  const dP=document.getElementById('chartDotPess');
  const dS=document.getElementById('chartDotStress');
  const pChart=document.getElementById('pChart');
  if(!svg||!ov||!pChart) return;

  pChart.style.position='relative';
  let tip=document.getElementById('chartTip');
  if(tip) tip.remove();
  tip=document.createElement('div');
  tip.id='chartTip';
  tip.style.cssText='display:none;position:absolute;background:#161e2c;border:1px solid rgba(255,255,255,0.12);border-radius:7px;padding:9px 12px;font-size:12px;color:#dde4ee;pointer-events:none;white-space:nowrap;z-index:20;box-shadow:0 4px 16px rgba(0,0,0,0.5)';
  pChart.appendChild(tip);

  const lookup=new Map(projData.map(p=>[p.month,p]));
  const now=new Date();
  const MONTHS_JP=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  function monthLabel(m){
    const d=new Date(now.getFullYear(),now.getMonth()+m,1);
    return `${d.getFullYear()}年 ${MONTHS_JP[d.getMonth()]}`;
  }

  function showAt(clientX, clientY, containerRect) {
    const scaleX=containerRect.width/W;
    const mxSvg=(clientX-containerRect.left)/scaleX;
    const frac=Math.max(0,Math.min(1,(mxSvg-PL)/cW));
    const m=Math.round(frac*maxM);
    const pt=lookup.get(m)||projData[projData.length-1];
    const hx=xs(pt.month).toFixed(1);

    hl.setAttribute('x1',hx); hl.setAttribute('x2',hx); hl.setAttribute('visibility','visible');
    [[dO,'optimistic'],[dB,'base'],[dP,'pessimistic']].forEach(([el,key])=>{
      el.setAttribute('cx',hx); el.setAttribute('cy',ys(pt[key]).toFixed(1)); el.setAttribute('visibility','visible');
    });
    if(dS && hasStress){
      dS.setAttribute('cx',hx); dS.setAttribute('cy',ys(pt.stress).toFixed(1)); dS.setAttribute('visibility','visible');
    }

    const tipX=clientX-containerRect.left, tipY=clientY-containerRect.top;
    const flipLeft=tipX>containerRect.width*0.62;
    tip.style.left=flipLeft?'auto':(tipX+14)+'px';
    tip.style.right=flipLeft?(containerRect.width-tipX+14)+'px':'auto';
    tip.style.top=Math.max(0,tipY-68)+'px';
    tip.innerHTML=`<div style="font-size:11px;font-weight:700;color:#6b7888;margin-bottom:6px;letter-spacing:.04em">${monthLabel(pt.month)}</div>`+
      `<div style="color:rgba(63,185,80,0.9);margin-bottom:2px">▲ ${fmt(pt.optimistic)}</div>`+
      `<div style="color:#58a6ff;margin-bottom:2px">— ${fmt(pt.base)}</div>`+
      `<div style="color:rgba(248,81,73,0.85);margin-bottom:${hasStress?'2px':'0'}">▼ ${fmt(pt.pessimistic)}</div>`+
      (hasStress?`<div style="color:rgba(139,148,158,0.9)">⚠ ${fmt(pt.stress)} <span style="color:#6b7888;font-size:10px">worst</span></div>`:'');
    tip.style.display='block';
  }

  function hide() {
    hl.setAttribute('visibility','hidden');
    [dO,dB,dP].forEach(el=>el.setAttribute('visibility','hidden'));
    if(dS) dS.setAttribute('visibility','hidden');
    tip.style.display='none';
  }

  ov.addEventListener('mousemove', e=>{
    showAt(e.clientX, e.clientY, svg.getBoundingClientRect());
  });
  ov.addEventListener('mouseleave', hide);

  // Touch support for mobile
  ov.addEventListener('touchstart', e=>{
    e.preventDefault();
    const t=e.touches[0];
    showAt(t.clientX, t.clientY, svg.getBoundingClientRect());
  }, {passive:false});
  ov.addEventListener('touchmove', e=>{
    e.preventDefault();
    const t=e.touches[0];
    showAt(t.clientX, t.clientY, svg.getBoundingClientRect());
  }, {passive:false});
  ov.addEventListener('touchend', ()=>{
    setTimeout(hide, 1200);
  });
}

// ── NW Milestones ─────────────────────────────────────────────────────────────
function renderMilestones(d, waterfallData, rates, container) {
  if (!container) return;
  const nw = d.netFinancialAssets;
  const MILESTONES = [50,100,200,300].map(m=>m*1e6);
  const next = MILESTONES.find(m => m > nw);
  const prev = [...MILESTONES].reverse().find(m => m <= nw) || 0;
  if (!next) { container.innerHTML = ''; return; }

  const pct = prev < next ? (nw - prev) / (next - prev) * 100 : 100;
  const remaining = next - nw;

  // ETA: use same projectBucket formula as projection tab base case (NFA buckets only, excludes T4)
  const NFA_KEYS = ['t1_index','t2','t3a_ideco','t0','t1_hysa','t1_gold','t3a_insurance','t3b'];
  let monthsTo = null;
  if (rates) {
    for (let m = 1; m <= 600; m++) {
      let projNFA = 0;
      for (const key of NFA_KEYS) {
        const r = rates[key];
        if (!r) continue;
        projNFA += projectBucket(r.currentValue, r.monthlyContrib, r.annualBase, m);
      }
      if (projNFA >= next) { monthsTo = m; break; }
    }
  }
  const timeStr = monthsTo
    ? monthsTo < 12 ? `約${monthsTo}ヶ月` : `約${Math.floor(monthsTo/12)}年${monthsTo%12?monthsTo%12+'ヶ月':''}`
    : null;

  const fmtM = v => (v/1e6).toFixed(0)+'M';
  container.innerHTML = `<div class="card" style="padding:12px 16px">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap">
      <div style="display:flex;align-items:baseline;gap:8px">
        <span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">純金融資産 次のマイルストーン</span>
        <span style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums">¥${fmtM(next)}</span>
      </div>
      <div style="font-size:12px;color:var(--muted);text-align:right">
        残り <span style="color:var(--text);font-weight:600;font-variant-numeric:tabular-nums">${fmt(remaining)}</span>
        ${timeStr ? `&ensp;·&ensp;<span style="color:var(--green)">${timeStr}</span>` : ''}
      </div>
    </div>
    <div style="position:relative;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden">
      <div style="height:100%;width:${pct.toFixed(1)}%;background:linear-gradient(90deg,#3fb950,#58a6ff);border-radius:3px"></div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums">
      <span>¥${fmtM(prev)}</span><span>¥${fmtM(next)}</span>
    </div>
  </div>`;
}

// ── Annual Contribution Summary ───────────────────────────────────────────────
function renderAnnualContrib(history, container) {
  if (!history || history.length < 2) { container.innerHTML = ''; return; }

  const now      = new Date();
  const yearStart = new Date(now.getFullYear(), 0, 1);

  // Baseline: last row before Jan 1, or first row if all data is within current year
  const prevRows = history.filter(r => r.date < yearStart);
  const baseline = prevRows.length ? prevRows[prevRows.length - 1] : history[0];
  const latest   = history[history.length - 1];

  const t1  = Math.max(0, (latest.t1_index_cost||0)  - (baseline.t1_index_cost||0));
  const t2  = Math.max(0, (latest.t2_cost||0)         - (baseline.t2_cost||0));
  const t3a = Math.max(0, (latest.t3a_ideco_cost||0)  - (baseline.t3a_ideco_cost||0));
  const total = t1 + t2 + t3a;

  if (!total) { container.innerHTML = ''; return; }

  // Days elapsed since start of measurement
  const refDate  = prevRows.length ? yearStart : baseline.date;
  const elapsed  = Math.max(1, (now - refDate) / (1000*60*60*24));
  const yearFrac = Math.min(1, (now - yearStart) / (365.25*24*60*60*1000));
  const annualise = v => v / elapsed * 365.25;

  const C = { T1:'#58a6ff', T2:'#d29922', T3a:'#34d399' };
  const rows = [
    { label:'T1 NISA',   val:t1,  color:C.T1  },
    { label:'T2 株式',   val:t2,  color:C.T2  },
    { label:'T3a iDeCo', val:t3a, color:C.T3a },
  ].filter(r => r.val > 0);

  // "On pace" = actual vs what a linear year-end pace would give
  // Bar: filled portion = % of year elapsed (the "expected" mark); dot = actual as % of annualised
  const monthsElapsed = now.getMonth() + 1;
  const yearLabel = prevRows.length
    ? `${now.getFullYear()}年（${monthsElapsed}ヶ月経過・${(yearFrac*100).toFixed(0)}%）`
    : `${now.getFullYear()}年 MTD`;

  const rowsHtml = [...rows, { label:'合計', val:total, color:'rgba(255,255,255,0.5)', isTot:true }].map(r => {
    const pace    = annualise(r.val);
    const barFill = Math.min(100, yearFrac * 100);                  // year progress line
    const actual  = Math.min(100, (r.val / Math.max(pace, 1)) * 100); // actual vs pace
    const onPace  = actual >= barFill * 0.9;
    const paceColor = onPace ? 'var(--green)' : 'var(--yellow)';
    return `
    <div style="display:flex;align-items:center;gap:10px;padding:5px 0;${r.isTot?'border-top:1px solid rgba(255,255,255,0.07);margin-top:4px;padding-top:8px':''}">
      <div style="display:flex;align-items:center;gap:6px;width:90px;flex-shrink:0">
        ${!r.isTot?`<span style="width:8px;height:8px;border-radius:2px;background:${r.color};flex-shrink:0;display:inline-block"></span>`:'<span style="width:8px"></span>'}
        <span style="font-size:12px;${r.isTot?'font-weight:700':''};color:var(--${r.isTot?'text':'muted'})">${r.label}</span>
      </div>
      <div style="flex:1;position:relative;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden">
        <div style="position:absolute;left:0;top:0;height:100%;width:${barFill.toFixed(1)}%;background:rgba(255,255,255,0.1);border-radius:2px"></div>
        <div style="position:absolute;left:0;top:0;height:100%;width:${Math.min(actual,barFill).toFixed(1)}%;background:${r.isTot?'rgba(255,255,255,0.4)':r.color};border-radius:2px"></div>
      </div>
      <span style="font-size:12px;font-variant-numeric:tabular-nums;min-width:80px;text-align:right">+${fmt(r.val)}</span>
      <span style="font-size:11px;color:${paceColor};min-width:90px;text-align:right" title="年換算ペース">${fmt(Math.round(pace))}<span style="font-size:9px;color:var(--muted)">/年</span></span>
    </div>`;
  }).join('');

  container.innerHTML = `<h2>年次積立サマリー</h2>
  <div class="card" style="padding:14px 16px">
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase">${yearLabel}</div>
    ${rowsHtml}
  </div>`;
}

}

// ── AI Summary ────────────────────────────────────────────────────────────────
function mdToHtml(text) {
  if (!text) return '';
  const lines = text.split('\n');
  let html = '', inList = false, inActionList = false, actionIdx = 0, inSection4 = false;
  for (let raw of lines) {
    let line = raw
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>');
    if (/^###\s+/.test(line)) {
      if (inActionList) { html += '</ul>'; inActionList = false; }
      if (inList) { html += '</ul>'; inList = false; }
      const headText = line.replace(/^###\s+/,'');
      // Detect section 4 (Priority Actions)
      inSection4 = /^4[.\s]/.test(headText);
      if (inSection4) actionIdx = 0;
      html += `<div class="ai-section-head">${headText}</div>`;
    } else if (/^[-*]\s+/.test(line)) {
      const itemText = line.replace(/^[-*]\s+/,'');
      if (inSection4) {
        // Action item with feedback buttons
        if (!inActionList) { html += '<ul class="ai-list" id="aiActionList">'; inActionList = true; }
        html += `<li class="ai-action-item" data-id="${actionIdx}">` +
          `<div class="ai-action-row">` +
          `<span class="ai-action-text">${itemText}</span>` +
          `<span class="ai-action-btns">` +
          `<button class="ai-fb-btn" data-fb="done" title="Mark done">✓</button>` +
          `<button class="ai-fb-btn" data-fb="skip" title="Skip">✗</button>` +
          `<button class="ai-fb-btn" data-fb="note" title="Add note">+</button>` +
          `</span></div>` +
          `<div class="ai-note-area" style="display:none"><input class="ai-note-input" placeholder="Add context…"></div>` +
          `</li>`;
        actionIdx++;
      } else {
        if (inActionList) { html += '</ul>'; inActionList = false; }
        if (!inList) { html += '<ul class="ai-list">'; inList = true; }
        html += `<li>${itemText}</li>`;
      }
    } else if (line.trim() === '') {
      if (inActionList) { html += '</ul>'; inActionList = false; }
      if (inList) { html += '</ul>'; inList = false; }
      html += '<div style="height:6px"></div>';
    } else {
      if (inActionList) { html += '</ul>'; inActionList = false; }
      if (inList) { html += '</ul>'; inList = false; }
      html += `<p class="ai-para">${line}</p>`;
    }
  }
  if (inActionList) html += '</ul>';
  if (inList) html += '</ul>';
  return html;
}

function initAIFeedback(summaryId) {
  const list = document.getElementById('aiActionList');
  if (!list) return;
  // Load saved feedback
  let saved = {};
  try {
    const raw = localStorage.getItem('wt_ai_feedback');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.summaryId === summaryId) {
        (parsed.items || []).forEach(item => { saved[item.id] = item; });
      }
    }
  } catch(_) {}

  function saveFeedback() {
    const items = [];
    list.querySelectorAll('.ai-action-item').forEach(li => {
      const id = +li.dataset.id;
      const textEl = li.querySelector('.ai-action-text');
      const noteEl = li.querySelector('.ai-note-input');
      const doneBtnActive = li.querySelector('[data-fb="done"]').classList.contains('active-done');
      const skipBtnActive = li.querySelector('[data-fb="skip"]').classList.contains('active-skip');
      const status = doneBtnActive ? 'done' : skipBtnActive ? 'skip' : '';
      const note = noteEl ? noteEl.value.trim() : '';
      if (status || note) items.push({ id, text: textEl.textContent.trim(), status, note });
    });
    localStorage.setItem('wt_ai_feedback', JSON.stringify({ summaryId, items }));
  }

  function applyState(li, status, note) {
    const textEl = li.querySelector('.ai-action-text');
    const doneBtn = li.querySelector('[data-fb="done"]');
    const skipBtn = li.querySelector('[data-fb="skip"]');
    const noteBtn = li.querySelector('[data-fb="note"]');
    const noteArea = li.querySelector('.ai-note-area');
    const noteInput = li.querySelector('.ai-note-input');
    textEl.className = 'ai-action-text' + (status ? ' ' + status : '');
    doneBtn.className = 'ai-fb-btn' + (status === 'done' ? ' active-done' : '');
    skipBtn.className = 'ai-fb-btn' + (status === 'skip' ? ' active-skip' : '');
    noteBtn.className = 'ai-fb-btn' + (note ? ' active-note' : '');
    if (note && noteInput) { noteInput.value = note; noteArea.style.display = 'block'; }
  }

  // Apply saved states
  list.querySelectorAll('.ai-action-item').forEach(li => {
    const id = +li.dataset.id;
    if (saved[id]) applyState(li, saved[id].status, saved[id].note || '');
  });

  // Attach handlers
  list.addEventListener('click', e => {
    const btn = e.target.closest('.ai-fb-btn');
    if (!btn) return;
    const li = btn.closest('.ai-action-item');
    const fb = btn.dataset.fb;
    const textEl = li.querySelector('.ai-action-text');
    const doneBtn = li.querySelector('[data-fb="done"]');
    const skipBtn = li.querySelector('[data-fb="skip"]');
    const noteBtn = li.querySelector('[data-fb="note"]');
    const noteArea = li.querySelector('.ai-note-area');
    const noteInput = li.querySelector('.ai-note-input');
    if (fb === 'done') {
      const wasActive = doneBtn.classList.contains('active-done');
      applyState(li, wasActive ? '' : 'done', noteInput ? noteInput.value.trim() : '');
    } else if (fb === 'skip') {
      const wasActive = skipBtn.classList.contains('active-skip');
      applyState(li, wasActive ? '' : 'skip', noteInput ? noteInput.value.trim() : '');
    } else if (fb === 'note') {
      const open = noteArea.style.display !== 'none';
      noteArea.style.display = open ? 'none' : 'block';
      if (!open) noteInput.focus();
    }
    saveFeedback();
  });

  list.querySelectorAll('.ai-note-input').forEach(input => {
    input.addEventListener('blur', () => saveFeedback());
  });
}

function buildFeedbackParam() {
  try {
    const raw = localStorage.getItem('wt_ai_feedback');
    if (!raw) return '';
    const parsed = JSON.parse(raw);
    if (!parsed.items || !parsed.items.length) return '';
    const lines = ['Previous action feedback:'];
    parsed.items.forEach(item => {
      let line = `- "${item.text}"`;
      if (item.status === 'done') line += ' → DONE';
      else if (item.status === 'skip') line += ' → SKIPPED';
      if (item.note) line += ` (note: "${item.note}")`;
      lines.push(line);
    });
    return btoa(unescape(encodeURIComponent(lines.join('\n'))));
  } catch(_) { return ''; }
}

function buildMoMBlock(d, waterfallData) {
  if (!waterfallData || !waterfallData.length) return '';
  const last = waterfallData[waterfallData.length - 1];
  if (!last.total && !last.contrib && !last.returns && !last.mortgagePaydown && !last.reChange) return '';
  const prevNW = d.totalNetWorth - last.total;
  const momPct = prevNW ? (last.total / prevNW * 100) : 0;
  const [yr, mo] = last.month.split('-');
  const monthLabel = last._mtd ? `${yr}年${parseInt(mo)}月 MTD` : `${yr}年${parseInt(mo)}月`;
  const totalColor = last.total >= 0 ? 'var(--green)' : 'var(--red)';
  const MC = { t1:'#58a6ff', t2:'#d29922', t3a:'#34d399', retPos:'#3fb950', retNeg:'#f85149', mort:'#bc8cff', re:'#f0883e' };

  // Drivers — filter zero, track key for biggest
  const allDrivers = [
    { key:'contrib', label:'資金追加', val:last.contrib,         color:MC.t1,
      subs: (last.contrib > 0 && (last.t2Contrib || last.t3aContrib))
        ? [{ label:'T1 NISA', val:last.t1Contrib, color:MC.t1 },
           { label:'T2 株式', val:last.t2Contrib, color:MC.t2 },
           { label:'T3a iDeCo', val:last.t3aContrib, color:MC.t3a }].filter(s => s.val)
        : [] },
    { key:'returns', label:'運用損益',   val:last.returns,         color:last.returns >= 0 ? MC.retPos : MC.retNeg, subs:[] },
    { key:'mort',    label:'ローン返済', val:last.mortgagePaydown, color:MC.mort, subs:[] },
    { key:'re',      label:'不動産変動', val:last.reChange,        color:MC.re,   subs:[] },
  ].filter(dr => dr.val !== 0);

  if (!allDrivers.length) return '';
  const biggest = allDrivers.reduce((a, b) => Math.abs(b.val) > Math.abs(a.val) ? b : a);

  // Mini stacked bar — positive drivers only
  const posSum = allDrivers.filter(dr => dr.val > 0).reduce((s, dr) => s + dr.val, 0) || 1;
  const barSegs = allDrivers.filter(dr => dr.val > 0)
    .map(dr => `<div class="ai-mom-bar-seg" style="width:${(dr.val/posSum*100).toFixed(1)}%;background:${dr.color}"></div>`)
    .join('');

  // Driver rows
  const driverRows = allDrivers.map(dr => {
    const pct = last.total ? Math.round(Math.abs(dr.val) / Math.abs(last.total) * 100) : 0;
    const badge = dr.key === biggest.key ? `<span class="ai-mom-badge">最大</span>` : '';
    const valColor = dr.val >= 0 ? 'var(--green)' : 'var(--red)';
    const mainRow = `<div class="ai-mom-row">
      <div class="ai-mom-dot" style="background:${dr.color}"></div>
      <span class="ai-mom-name">${dr.label}</span>${badge}
      <span class="ai-mom-val" style="color:${valColor}">${dr.val>=0?'+':''}${fmt(dr.val)}</span>
      <span class="ai-mom-pct-col">${pct}%</span>
    </div>`;
    const subRows = (dr.subs||[]).map(s => {
      const sp = last.contrib ? Math.round(s.val / last.contrib * 100) : 0;
      return `<div class="ai-mom-row sub">
        <div class="ai-mom-dot" style="background:${s.color}"></div>
        <span class="ai-mom-name">${s.label}</span>
        <span class="ai-mom-val" style="color:var(--muted)">+${fmt(s.val)}</span>
        <span class="ai-mom-pct-col">${sp}%</span>
      </div>`;
    }).join('');
    return mainRow + subRows;
  }).join('');

  return `<div class="ai-mom">
    <div class="ai-mom-header">
      <span class="ai-mom-month">${monthLabel}</span>
      <span class="ai-mom-total" style="color:${totalColor}">${last.total>=0?'+':''}${fmt(last.total)}</span>
      <span class="ai-mom-pct">(${momPct>=0?'+':''}${momPct.toFixed(1)}% ${last._mtd ? 'MTD' : 'MoM'})</span>
    </div>
    <div class="ai-mom-bar-track">${barSegs}</div>
    <div class="ai-mom-drivers">${driverRows}</div>
  </div>`;
}

function renderMoMSnapshot(d, waterfallData, container) {
  if (!container) return;
  const block = buildMoMBlock(d, waterfallData);
  if (!block) { container.innerHTML = ''; return; }
  container.innerHTML = `<h2>月次変動内訳</h2><div class="card" style="padding:12px 14px;margin-bottom:10px">${block}</div>`;
}

function buildMoMParam(waterfallData) {
  if (!waterfallData || !waterfallData.length) return '';
  try {
    const last = waterfallData[waterfallData.length - 1];
    const [yr, mo] = last.month.split('-');
    const fd = v => (v >= 0 ? '+' : '') + '¥' + Math.abs(Math.round(v)).toLocaleString();
    const pct = (v, tot) => tot ? ` (${Math.round(Math.abs(v) / Math.abs(tot) * 100)}% of change)` : '';
    const drivers = [
      ['Contributions', last.contrib],
      ['Investment returns', last.returns],
      ['Mortgage paydown', last.mortgagePaydown],
      ['Real estate change', last.reChange],
    ].filter(([, v]) => v !== 0);
    if (!drivers.length) return '';
    const biggest = drivers.reduce((a, b) => Math.abs(b[1]) > Math.abs(a[1]) ? b : a);
    const lines = [
      `Month-over-month NW snapshot (${yr}-${mo}):`,
      `Total NW change: ${fd(last.total)}`,
      ...drivers.map(([label, val]) => `  ${label}: ${fd(val)}${pct(val, last.total)}`),
      `Biggest driver this month: ${biggest[0]} at ${fd(biggest[1])}`,
    ];
    if (last.t1Contrib || last.t2Contrib || last.t3aContrib) {
      lines.push(`  Contribution breakdown: T1 NISA ${fd(last.t1Contrib)}, T2 ${fd(last.t2Contrib)}, T3a iDeCo ${fd(last.t3aContrib)}`);
    }
    return btoa(unescape(encodeURIComponent(lines.join('\n'))));
  } catch(_) { return ''; }
}

    return plain.length > 120 ? plain.slice(0, 117) + '…' : plain;
  })();

  container.innerHTML = `
    <h2 id="aiToggle" style="cursor:pointer;user-select:none">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">

    </h2>
