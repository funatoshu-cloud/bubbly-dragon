<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wealthtrack</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#090c13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wealthtrack">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #090c13;
  --surface: #0f1520;
  --surface2: #161e2c;
  --border: rgba(255,255,255,0.07);
  --text: #dde4ee;
  --muted: #6b7888;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --blue: #58a6ff;
  --purple: #bc8cff;
  --accent: #1a5c2a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; font-size: 13px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--blue); }

/* Layout */
.container { max-width: 1280px; margin: 0 auto; padding: 12px 16px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
.card-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 6px; }
.card-value { font-size: 20px; font-weight: 700; }
.card-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }

/* Header */
.header { background: var(--surface); border: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; border-radius: 8px; }
.header-title { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.header-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; font-size: 11px; color: var(--muted); }
.btn { background: var(--accent); border: none; color: #fff; border-radius: 5px; padding: 5px 12px; cursor: pointer; font-size: 11px; font-weight: 700; letter-spacing: .04em; }
.btn:hover { opacity: .85; }
.btn:disabled { opacity: .4; cursor: default; }

/* Section titles */
h2 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 18px 0 8px; border-left: 2px solid var(--blue); padding-left: 8px; }

/* Tier table */
.tier-table { width: 100%; border-collapse: collapse; }
.tier-table th { text-align: left; padding: 7px 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border-bottom: 1px solid var(--border); }
.tier-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
.tier-table tfoot td { border-bottom: none; border-top: 1px solid var(--border); font-weight: 700; }
.tier-table tbody tr:hover td { background: var(--surface2); }
.tier-badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: 700; letter-spacing: .04em; }
.t0 { background:#0c1e2e; color:#58a6ff; }
.t1 { background:#0c2018; color:#3fb950; }
.t2 { background:#261a08; color:#d29922; }
.t3a { background:#1a1028; color:#bc8cff; }
.t3b { background:#240e14; color:#f0883e; }
.t4 { background:#151a22; color:#8b949e; }
.pct-bar-wrap { display: flex; align-items: center; }
.pct-bar { height: 3px; border-radius: 2px; background: var(--blue); flex-shrink: 0; opacity: .6; }

/* Leverage */
.lev-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.lev-header h2 { margin-bottom: 0; }
.lev-income { font-size: 11px; color: var(--muted); }
.leverage-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
.lev-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; }
.lev-title { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
.lev-eq { font-size: 11px; color: var(--muted); margin-bottom: 12px; }
.lev-body { display: flex; align-items: flex-end; justify-content: space-between; }
.lev-actual { font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.lev-target-col { text-align: right; }
.lev-target-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 3px; }
.lev-target-val { font-size: 19px; font-weight: 700; line-height: 1; }
.lev-green { color: var(--green); }
.lev-yellow { color: var(--yellow); }
.lev-red { color: var(--red); }
.ok { color: var(--green); }
.warn { color: var(--yellow); }
.bad { color: var(--red); }

/* Scorecard table */
.sc-table { width: 100%; border-collapse: collapse; }
.sc-table th { text-align: left; padding: 7px 14px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border-bottom: 1px solid var(--border); }
.sc-table th:nth-child(2), .sc-table th:nth-child(3) { text-align: right; }
.sc-table td { padding: 9px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
.sc-table td:nth-child(2), .sc-table td:nth-child(3) { text-align: right; font-variant-numeric: tabular-nums; }
.sc-table tbody tr:not(.sc-section):last-child td { border-bottom: none; }
.sc-table tbody tr:not(.sc-section):hover td { background: var(--surface2); }
.sc-section td { padding: 4px 14px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--yellow); background: var(--surface2); border-bottom: 1px solid var(--border); }
.sc-green { color: var(--green) !important; font-weight: 700; }
.sc-yellow { color: var(--yellow) !important; font-weight: 700; }
.sc-red { color: var(--red) !important; font-weight: 700; }

/* Holdings table */
.holdings-wrap { overflow-x: auto; }
.holdings-table { width: 100%; border-collapse: collapse; white-space: nowrap; }
.holdings-table th { text-align: right; padding: 7px 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
.holdings-table th:first-child, .holdings-table th:nth-child(2) { text-align: left; }
.holdings-table th:hover { color: var(--text); }
.holdings-table th.sort-asc::after { content: ' ↑'; }
.holdings-table th.sort-desc::after { content: ' ↓'; }
.holdings-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); text-align: right; font-variant-numeric: tabular-nums; }
.holdings-table td:first-child, .holdings-table td:nth-child(2) { text-align: left; }
.holdings-table tr:hover td { background: var(--surface2); }
.holdings-table tfoot td { font-weight: 700; border-top: 1px solid var(--border); border-bottom: none; }
.gain { color: var(--green); }
.loss { color: var(--red); }
.neutral { color: var(--muted); }

/* Sector bars */
.sector-row { display: flex; align-items: center; gap: 12px; margin-bottom: 7px; }
.sector-name { width: 176px; flex-shrink: 0; font-size: 12px; }
.sector-bar-bg { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.sector-bar-fill { height: 100%; border-radius: 3px; transition: width .3s; }
.sector-pct { width: 38px; text-align: right; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Progress */
.progress-wrap { margin-top: 6px; }
.progress-bg { height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width .4s; }

/* Top metrics row 1 */
.top-metrics { display: grid; grid-template-columns: repeat(6,1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
.top-metric { background: var(--surface); padding: 10px 14px; }
.top-metric-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-metric-value { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; }

/* Equation row */
.eq-row { display: flex; align-items: stretch; margin-bottom: 12px; }
.eq-card { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 13px 16px; min-width: 0; }
.eq-op { display: flex; align-items: center; justify-content: center; width: 30px; flex-shrink: 0; font-size: 17px; font-weight: 600; color: var(--muted); }
.eq-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 5px; }
.eq-value { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; margin-bottom: 2px; }
.eq-sub { font-size: 10px; color: var(--muted); }
.tier-bar { display: flex; height: 3px; border-radius: 2px; overflow: hidden; margin-top: 10px; }
.tier-bar span { height: 100%; }

/* Loading / error */
#loading { text-align: center; padding: 60px; color: var(--muted); }
.error-box { background: #2d1a1a; border: 1px solid var(--red); border-radius: 8px; padding: 14px; color: var(--red); margin: 14px 0; }

/* Tab switcher */
.tabs { display:flex; gap:2px; background:var(--surface2); border-radius:6px; padding:3px; }
.tab { padding:5px 16px; border-radius:4px; font-size:12px; font-weight:600; cursor:pointer; border:none; background:transparent; color:var(--muted); letter-spacing:.02em; transition:background .15s,color .15s; }
.tab.active { background:var(--surface); color:var(--text); }

/* Projection panel */
.proj-warning { border-radius:6px; padding:10px 14px; font-size:12px; margin-bottom:12px; border:1px solid; }
.proj-warning.red { background:rgba(248,81,73,.1); border-color:var(--red); color:var(--red); }
.proj-warning.yellow { background:rgba(210,153,34,.1); border-color:var(--yellow); color:var(--yellow); }
.proj-inputs { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px; }
.proj-group { display:flex; flex-direction:column; gap:5px; }
.proj-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
.proj-select,.proj-number { background:var(--surface2); border:1px solid var(--border); border-radius:5px; color:var(--text); padding:5px 10px; font-size:13px; }
.proj-select { min-width:160px; } .proj-number { width:150px; }
input[type=range] { accent-color:var(--blue); width:180px; cursor:pointer; }
.proj-table { width:100%; border-collapse:collapse; }
.proj-table th { text-align:right; padding:6px 12px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); border-bottom:1px solid var(--border); }
.proj-table th:first-child { text-align:left; }
.proj-table td { padding:8px 12px; border-bottom:1px solid var(--border); text-align:right; font-variant-numeric:tabular-nums; font-size:13px; }
.proj-table td:first-child { text-align:left; }
.proj-table tfoot td { font-weight:700; border-top:1px solid var(--border); border-bottom:none; }
.manual-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(185px,1fr)); gap:8px; margin-bottom:14px; }
.manual-card { background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:10px 12px; }
.manual-card-title { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-bottom:7px; }
.manual-row { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
.manual-row label { font-size:11px; color:var(--muted); width:58px; flex-shrink:0; }
.manual-row input { background:var(--bg); border:1px solid var(--border); border-radius:4px; color:var(--text); padding:3px 7px; font-size:12px; width:80px; }

/* Responsive */
@media (max-width: 1000px) {
  .top-metrics { grid-template-columns: repeat(3,1fr); }
}
@media (max-width: 900px) {
  .grid-4 { grid-template-columns: repeat(2,1fr); }
  .grid-3 { grid-template-columns: repeat(2,1fr); }
  .sector-name { width: 130px; }
  .lev-actual { font-size: 22px; }
  .lev-target-val { font-size: 17px; }
  .eq-value { font-size: 14px; }
  .eq-op { width: 22px; font-size: 13px; }
}
@media (max-width: 600px) {
  .top-metrics { grid-template-columns: repeat(2,1fr); }
  .eq-row { flex-wrap: wrap; gap: 8px; }
  .eq-card { flex: 1 1 40%; }
  .eq-op { display: none; }
  .grid-2, .grid-3, .grid-4, .leverage-grid { grid-template-columns: 1fr; }
  .header { flex-direction: column; align-items: flex-start; }
  .lev-header { flex-direction: column; gap: 2px; }
  .lev-actual { font-size: 22px; }
  .lev-target-val { font-size: 17px; }
}
</style>
</head>
<body>
<div class="container">
  <div id="loading">データ読み込み中...</div>
  <div id="dashboard" style="display:none"></div>
</div>

<script>
// ── Data sources ──────────────────────────────────────────────────────────────
const CLEAN_URL     = 'https://docs.google.com/spreadsheets/d/1j9az4y9uJ_hVbgFFeps7odLkMfHb6Iyi4Cl2LTcYGbU/export?format=csv&gid=1838261664';
const PORTFOLIO_URL = 'https://docs.google.com/spreadsheets/d/1j9az4y9uJ_hVbgFFeps7odLkMfHb6Iyi4Cl2LTcYGbU/export?format=csv&gid=2040776062';
const HISTORY_URL   = 'https://docs.google.com/spreadsheets/d/1j9az4y9uJ_hVbgFFeps7odLkMfHb6Iyi4Cl2LTcYGbU/export?format=csv&gid=58449373';

// History column indices (0=date, then per schema)
const HCOL = { t1_index_value:1,t1_index_cost:2,t2_value:3,t2_cost:4,t3a_ideco_value:5,t3a_ideco_cost:6,t4_land:7,t4_building:8,t4_mortgage:9,t0_value:10,t1_gold:11,t1_hysa:12,t3a_insurance:13,t3b_value:14 };
const MONTHLY_COLS = ['t0_value','t1_gold','t1_hysa','t3a_insurance','t3b_value'];
let _history = [];

function parseHistory(rows) {
  const data = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r || !r[0]) continue;
    const entry = { date: new Date(r[0]) };
    for (const [col, idx] of Object.entries(HCOL)) {
      const v = r[idx] ? parseFloat(String(r[idx]).replace(/[¥,%x,]/g,'')) : null;
      entry[col] = (v !== null && !isNaN(v)) ? v : null;
    }
    data.push(entry);
  }
  // Forward-fill monthly columns
  for (const col of MONTHLY_COLS) {
    let last = null;
    for (const row of data) { if (row[col] !== null) last = row[col]; else row[col] = last; }
  }
  return data;
}

function arrMedian(arr) {
  if (!arr.length) return 0;
  const s = [...arr].sort((a,b)=>a-b), m = Math.floor(s.length/2);
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2;
}
function arrStddev(arr) {
  if (arr.length < 2) return 0;
  const mean = arr.reduce((s,v)=>s+v,0)/arr.length;
  return Math.sqrt(arr.reduce((s,v)=>s+(v-mean)**2,0)/(arr.length-1));
}

function computeRates(history) {
  if (history.length < 2) return null;
  const rates = {};

  // Investment buckets: daily value + cost tracking
  for (const [key, vCol, cCol] of [['t1_index','t1_index_value','t1_index_cost'],['t2','t2_value','t2_cost'],['t3a_ideco','t3a_ideco_value','t3a_ideco_cost']]) {
    const dailyReturns=[], monthlyContribs=[];
    let pv=null,pc=null,pm=null;
    for (const row of history) {
      const v=row[vCol], c=row[cCol];
      if (v!==null && c!==null && pv!==null && pc!==null && pv>0 && v!==pv) {
        // Pure investment return: Δ(value-cost) / prev_value
        dailyReturns.push(((v-c)-(pv-pc))/pv);
      }
      const rm = row.date.getFullYear()*12+row.date.getMonth();
      if (pm!==null && rm!==pm && pc!==null && c!==null && c>pc) monthlyContribs.push(c-pc);
      if (v!==null) pv=v; if (c!==null) pc=c; pm=rm;
    }
    const med=arrMedian(dailyReturns), sd=arrStddev(dailyReturns);
    const filt=dailyReturns.filter(r=>Math.abs(r-med)<=3*sd);
    const last=history[history.length-1];
    rates[key]={ annualBase:arrMedian(filt)*252, annualSigma:arrStddev(filt)*Math.sqrt(252), monthlyContrib:arrMedian(monthlyContribs)||0, currentValue:last[vCol]||0 };
  }

  // T4 equity = land + building - mortgage (exclude 繰上げ返済 days)
  const mortDeltas=[];
  for (let i=1;i<history.length;i++) { const d=history[i].t4_mortgage-history[i-1].t4_mortgage; if(d<0) mortDeltas.push(Math.abs(d)); }
  const typicalPmt=arrMedian(mortDeltas)||1;
  const t4Returns=[];
  for (let i=1;i<history.length;i++) {
    const p=history[i-1],c=history[i];
    if([p.t4_land,p.t4_building,p.t4_mortgage,c.t4_land,c.t4_building,c.t4_mortgage].some(v=>v===null)) continue;
    if(Math.abs(c.t4_mortgage-p.t4_mortgage)>2*typicalPmt) continue; // skip 繰上げ返済
    const eq0=p.t4_land+p.t4_building-p.t4_mortgage, eq1=c.t4_land+c.t4_building-c.t4_mortgage;
    if(eq0>0 && eq0!==eq1) t4Returns.push((eq1-eq0)/eq0);
  }
  const t4Med=arrMedian(t4Returns), t4Sd=arrStddev(t4Returns);
  const t4Filt=t4Returns.filter(r=>Math.abs(r-t4Med)<=3*t4Sd);
  const last=history[history.length-1];
  rates.t4={ annualBase:arrMedian(t4Filt)*365, annualSigma:arrStddev(t4Filt)*Math.sqrt(365), monthlyContrib:0, currentValue:(last.t4_land||0)+(last.t4_building||0)-(last.t4_mortgage||0) };

  // Monthly buckets: simple ΔV/V
  for (const [key,col] of [['t0','t0_value'],['t1_hysa','t1_hysa'],['t1_gold','t1_gold'],['t3a_insurance','t3a_insurance'],['t3b','t3b_value']]) {
    const returns=[]; let prev=null;
    for (const row of history) { const v=row[col]; if(v!==null){if(prev!==null&&prev>0&&v!==prev) returns.push((v-prev)/prev); prev=v;} }
    rates[key]={ annualBase:arrMedian(returns)*12, annualSigma:arrStddev(returns)*Math.sqrt(12), monthlyContrib:0, currentValue:last[col]||0 };
  }
  return rates;
}

function projectBucket(currentVal, monthlyContrib, annualRate, months) {
  const r=annualRate/12;
  if(Math.abs(r)<0.000001) return currentVal+monthlyContrib*months;
  const g=Math.pow(1+r,months);
  return currentVal*g+monthlyContrib*(g-1)/r;
}

function buildProjection(rates, months, contribMode) {
  const KEYS=['t1_index','t2','t3a_ideco','t4','t0','t1_hysa','t1_gold','t3a_insurance','t3b'];
  const result=[];
  for(let m=0;m<=months;m++){
    let base=0,opt=0,pess=0;
    for(const key of KEYS){
      const r=rates[key]; if(!r) continue;
      const contrib=contribMode==='stopped'?0:r.monthlyContrib;
      base +=projectBucket(r.currentValue,contrib,r.annualBase,m);
      opt  +=projectBucket(r.currentValue,contrib,r.annualBase+r.annualSigma,m);
      pess +=projectBucket(r.currentValue,contrib,r.annualBase-r.annualSigma,m);
    }
    result.push({month:m,base,optimistic:opt,pessimistic:pess});
  }
  return result;
}

function buildChart(projData, currentNW, targetNW) {
  const W=800,H=260,PL=72,PR=20,PT=20,PB=40;
  const cW=W-PL-PR, cH=H-PT-PB;
  const months=projData[projData.length-1].month;
  const allV=projData.flatMap(p=>[p.base,p.optimistic,p.pessimistic]);
  if(targetNW) allV.push(targetNW);
  const minV=Math.min(...allV)*0.97, maxV=Math.max(...allV)*1.03;
  const xs=m=>PL+(m/months)*cW, ys=v=>PT+(1-(v-minV)/(maxV-minV))*cH;

  const line=(key,color,dash='')=>{
    const d=projData.map(p=>`${xs(p.month).toFixed(1)},${ys(p[key]).toFixed(1)}`).join(' ');
    return `<polyline points="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"${dash?` stroke-dasharray="${dash}"`:''}/>`;
  };
  const bandPts=[...projData.map(p=>`${xs(p.month).toFixed(1)},${ys(p.optimistic).toFixed(1)}`),
                 ...[...projData].reverse().map(p=>`${xs(p.month).toFixed(1)},${ys(p.pessimistic).toFixed(1)}`)].join(' ');

  let grid='',yLbl='';
  for(let i=0;i<=5;i++){
    const v=minV+(maxV-minV)*(i/5), y=ys(v).toFixed(1);
    grid+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="rgba(255,255,255,0.05)"/>`;
    yLbl+=`<text x="${PL-6}" y="${y}" text-anchor="end" dominant-baseline="middle" fill="#6b7888" font-size="10">${(v/1000000).toFixed(0)}M</text>`;
  }
  let xLbl='';
  for(let yr=0;yr<=Math.floor(months/12);yr++){
    const x=xs(yr*12).toFixed(1);
    xLbl+=`<text x="${x}" y="${H-PB+16}" text-anchor="middle" fill="#6b7888" font-size="10">${yr===0?'Now':yr+'yr'}</text>`;

  }

  <circle cx="${PL+142}" cy="${legendY}" r="4" fill="#f85149"/><text x="${PL+150}" y="${legendY}" dominant-baseline="middle" fill="#6b7888" font-size="10">Pessimistic</text>`;

  ${legend}

}

function renderProjection(d, history) {
  const el=document.getElementById('projection'); if(!el) return;
  const histDays=history.length;
  const canAuto=histDays>=30;
  const rates=canAuto?computeRates(history):null;

  const BUCKET_LABELS={t1_index:'T1 Index funds',t2:'T2 Stocks',t3a_ideco:'T3(a) iDeCo',t4:'T4 Real estate equity',t0:'T0 Cash',t1_hysa:'T1 HYSA',t1_gold:'T1 Gold',t3a_insurance:'T3(a) Insurance',t3b:'T3(b) 529'};
  const HAS_CONTRIB=['t1_index','t2','t3a_ideco'];

  const currentFromHistory=(key)=>{
    if(!history.length) return 0;
    const l=history[history.length-1];
    if(key==='t4') return (l.t4_land||0)+(l.t4_building||0)-(l.t4_mortgage||0);
    const colMap={t1_index:'t1_index_value',t2:'t2_value',t3a_ideco:'t3a_ideco_value',t0:'t0_value',t1_hysa:'t1_hysa',t1_gold:'t1_gold',t3a_insurance:'t3a_insurance',t3b:'t3b_value'};
    return l[colMap[key]]||0;
  };

  const warnHtml=histDays<30
    ?`<div class="proj-warning red">Not enough data (${histDays} day${histDays!==1?'s':''} recorded) — enter rates manually to preview a projection, or wait until 30 days have been captured.</div>`
    :histDays<365
    ?`<div class="proj-warning yellow">Limited data (${histDays} days) — estimates may not reflect full annual contribution patterns.</div>`:'';

  const manualCardsHtml=Object.entries(BUCKET_LABELS).map(([key,label])=>{
    const r=rates&&rates[key];
    const defContrib=r?Math.round(r.monthlyContrib):0;
    const defRate=r?(r.annualBase*100).toFixed(1):'5.0';
    return `<div class="manual-card">
      <div class="manual-card-title">${label}</div>
      ${HAS_CONTRIB.includes(key)?`<div class="manual-row"><label>¥/month</label><input id="mr_c_${key}" type="number" value="${defContrib}" step="10000"></div>`:''}
      <div class="manual-row"><label>Return %</label><input id="mr_r_${key}" type="number" value="${defRate}" step="0.1"></div>
    </div>`;
  }).join('');

  el.innerHTML=`
    ${warnHtml}
    <div class="proj-inputs">
      <div class="proj-group">
        <span class="proj-label">Time horizon — <span id="pHL">10 years</span></span>
        <input type="range" id="pHorizon" min="1" max="30" value="10">
      </div>
      <div class="proj-group">
        <span class="proj-label">Contributions</span>
        <select id="pContrib" class="proj-select">
          <option value="auto">Historical pace</option>
          <option value="manual">Manual input</option>
          <option value="stopped">Stopped</option>
        </select>
      </div>
      <div class="proj-group">
        <span class="proj-label">NW target (¥)</span>
        <input type="number" id="pTarget" class="proj-number" placeholder="e.g. 100000000" step="1000000">
      </div>
    </div>
    <div id="pManual" style="display:none"><h2>Manual rates</h2><div class="manual-grid">${manualCardsHtml}</div></div>
    <div class="card" style="padding:14px 14px 10px"><div id="pChart"></div><div id="pAnnotation" style="margin-top:6px"></div></div>
    <div class="card" style="padding:0;overflow-x:auto;margin-top:10px">
      <table class="proj-table">
        <thead><tr><th style="text-align:left">Bucket</th><th>Current</th><th>Projected</th><th>Capital added</th><th>Returns</th><th>Ann. rate</th></tr></thead>
        <tbody id="pTbody"></tbody>
        <tfoot><tr id="pTfoot"></tr></tfoot>
      </table>
    </div>
    <div style="height:32px"></div>`;

  function rebuild(){
    const yrs=parseInt(document.getElementById('pHorizon').value)||10;
    const mode=document.getElementById('pContrib').value;
    const target=parseFloat((document.getElementById('pTarget').value||'0').replace(/[¥,]/g,''))||0;
    const months=yrs*12;
    document.getElementById('pHL').textContent=yrs+' year'+(yrs!==1?'s':'');
    document.getElementById('pManual').style.display=mode==='manual'?'block':'none';

    // Build rates to use
    let pr={};
    for(const key of Object.keys(BUCKET_LABELS)){
      const r=rates&&rates[key];
      const cv=r?r.currentValue:currentFromHistory(key);
      let annualBase=r?r.annualBase:0.05, annualSigma=r?r.annualSigma:0, monthlyContrib=r?r.monthlyContrib:0;
      if(mode==='manual'){
        const rc=document.getElementById(`mr_c_${key}`), rr=document.getElementById(`mr_r_${key}`);
        if(rr) annualBase=(parseFloat(rr.value)||0)/100;
        if(rc) monthlyContrib=parseFloat(rc.value)||0;
        annualSigma=0;
      }
      if(mode==='stopped') monthlyContrib=0;
      pr[key]={annualBase,annualSigma,monthlyContrib,currentValue:cv};
    }

    if(!Object.values(pr).some(r=>r.currentValue>0)){
      document.getElementById('pChart').innerHTML='<p style="color:var(--muted);text-align:center;padding:40px">No data available yet.</p>';
      return;
    }

    const projData=buildProjection(pr,months,mode);
    const currentNW=projData[0].base;

    // Annotations
    let ann='';
    if(target>0){
      const hit=projData.find(p=>p.base>=target);
      ann=hit?`<span style="font-size:12px;color:var(--green)">📈 Base reaches target in ${Math.floor(hit.month/12)}y ${hit.month%12}m</span>`
             :`<span style="font-size:12px;color:var(--muted)">Base scenario does not reach target within ${yrs} years</span>`;
    }
    if(months>histDays*5) ann+=(ann?'&ensp;':'')+'<span style="font-size:11px;color:var(--yellow)">⚠ Long projection with limited history</span>';
    document.getElementById('pAnnotation').innerHTML=ann;

    document.getElementById('pChart').innerHTML=buildChart(projData,currentNW,target||null);

    // Summary table
    let totalCur=0,totalProj=0,totalCap=0,totalRet=0;
    document.getElementById('pTbody').innerHTML=Object.entries(BUCKET_LABELS).map(([key,label])=>{
      const r=pr[key]; if(!r||r.currentValue===0) return '';
      const proj=projectBucket(r.currentValue,r.monthlyContrib,r.annualBase,months);
      const cap=r.monthlyContrib*months, ret=proj-r.currentValue-cap;
      totalCur+=r.currentValue; totalProj+=proj; totalCap+=cap; totalRet+=ret;
      return `<tr><td>${label}</td><td>${fmt(r.currentValue)}</td><td>${fmt(proj)}</td><td class="gain">+${fmt(cap)}</td><td class="${colorClass(ret)}">${sign(ret)}${fmt(ret)}</td><td style="color:var(--muted)">${(r.annualBase*100).toFixed(1)}%</td></tr>`;
    }).join('');
    document.getElementById('pTfoot').innerHTML=`<td>Total</td><td>${fmt(totalCur)}</td><td>${fmt(totalProj)}</td><td class="gain">+${fmt(totalCap)}</td><td class="${colorClass(totalRet)}">${sign(totalRet)}${fmt(totalRet)}</td><td></td>`;
  }

  ['pHorizon','pContrib','pTarget'].forEach(id=>{
    const el=document.getElementById(id);
    el.addEventListener('input',rebuild); el.addEventListener('change',rebuild);
  });
  document.querySelectorAll('.manual-card input').forEach(el=>el.addEventListener('input',rebuild));
  rebuild();
}

// Hardcoded targets/goals not present in clean data:
const PASSIVE_INCOME_TARGET = 831264;
const TIER_GOAL = 60000000; // Stretch goal

// Scorecard targets [name, target-string, pass-fn(value, raw)]
const SCORECARD_TARGETS = [
  { target: '>60%',  pass: v => v >= 60,    isNum: false },
  { target: '>40%',  pass: v => v >= 40,    isNum: false },
  { target: '<40%',  pass: v => v < 40,     isNum: false },
  { target: '<10%',  pass: v => v < 10,     isNum: false },
  { target: '¥4.0M', pass: v => v >= 4000000, isNum: true  },
  { target: '<30%',  pass: v => v < 30,     isNum: false },
  { target: '>2.5%', pass: v => v >= 2.5,   isNum: false },
];

// ── CSV parser (handles quoted fields) ───────────────────────────────────────
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (c === '"') inQ = false;
      else field += c;
    } else {
      if (c === '"') { inQ = true; }
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c !== '\r') field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function num(s) { return parseFloat(String(s).replace(/[¥,x\s]/g, '')) || 0; }
function pct(s) { return parseFloat(String(s).replace('%','')) || 0; }
function fmt(n)  { return '¥' + Math.round(n).toLocaleString('ja-JP'); }
function fmtM(n) { return '¥' + (n/1000000).toFixed(2) + 'M'; }
function fmtK(n) { return '¥' + Math.round(n/1000) + 'k'; }

// ── Extract data from parsed CSV rows ────────────────────────────────────────
function extract(rows, pfRows) {
  const d = {};

  // Row 0: exchange rate
  d.exchangeRate = parseFloat(rows[0][0]) || 158.7;

  // Rows 10-15: tiers (T0–T4), row 16: total, row 17: goal
  const tierDefs = [
    { id:'T0', color:'t0', labelEn:'Liquidity Buffer' },
    { id:'T1', color:'t1', labelEn:'Core Portfolio' },
    { id:'T2', color:'t2', labelEn:'Satellite' },
    { id:'T3(a)', color:'t3a', labelEn:'Restricted (Retirement)' },
    { id:'T3(b)', color:'t3b', labelEn:'Conditional Assets' },
    { id:'T4', color:'t4', labelEn:'Real Estate' },
  ];
  d.tiers = tierDefs.map((def, i) => {
    const r = rows[10 + i] || [];
    return {
      ...def,
      desc: r[2] || '',
      types: r[3] || '',
      amount: num(r[4]),
      pctNum: pct(r[5]),
      pctStr: r[5] || '',
    };
  });
  d.totalNetWorth = num((rows[16] || [])[4]);
  d.netFinancialAssets = d.totalNetWorth - d.tiers[5].amount;

  // Scorecard (same tier rows, cols 10-11)
  d.scorecard = d.tiers.slice(0, 7).map((_, i) => {
    const r = rows[10 + i] || [];
    const name = r[10] || '';
    const rawVal = r[11] || '';
    const def = SCORECARD_TARGETS[i];
    if (!name) return null;
    const numVal = def.isNum ? num(rawVal) : pct(rawVal);
    return { name, rawVal, numVal, ...def, pass: def.pass(numVal) };
  }).filter(Boolean);

  // NISA rows 17-18
  const nisaRow = rows[17] || [];
  const lifetimeRow = rows[18] || [];
  d.nisa2026  = { name: nisaRow[10] || '2026年枠',    pctStr: nisaRow[11] || '', used: num(nisaRow[12]),   limit: num(nisaRow[13]) };
  d.nisaLife  = { name: lifetimeRow[10] || '生涯投資枠', pctStr: lifetimeRow[11] || '', used: num(lifetimeRow[12]), limit: num(lifetimeRow[13]) };

  // Real estate (rows 39-42)
  const re = rows[39] || [], nw = rows[40] || [], di = rows[41] || [], ds = rows[42] || [];
  const mRnd = v => '¥' + Math.round(v / 1000000) + 'M';
  d.mortgage        = num(nw[3]);
  d.realEstateValue = d.tiers[5].amount + d.mortgage;
  d.annualIncome    = num(di[3]);
  d.ltv       = { result: re[4]||'', actual: pct(re[4]), target: '<70%',  eq: `${mRnd(num(re[2])*10000)} ÷ ${mRnd(num(re[3])*10000)}` };
  d.nwCoverage= { result: nw[4]||'', actual: pct(nw[4]), target: '>50%',  eq: `${mRnd(num(nw[2]))} ÷ ${mRnd(num(nw[3]))}` };
  d.debtIncome= { result: di[4]||'', val: parseFloat((di[4]||'').replace('x','')||0), target: '<6x',    eq: `${mRnd(num(di[2]))} ÷ ${mRnd(num(di[3]))}` };
  d.dscr      = { result: ds[4]||'', val: parseFloat((ds[4]||'').replace('x','')||0), target: '<30%',   eq: `${mRnd(num(ds[2]))} ÷ ${mRnd(num(ds[3]))}` };

  // Holdings (rows 81–119)
  d.holdings = [];
  for (let i = 81; i < Math.min(rows.length, 121); i++) {
    const r = rows[i];
    if (!r || !r[1] || !r[2] || !r[3]) continue;
    if (!r[1].match(/^T[0-9]/)) continue;
    const val = num(r[4]);
    const profit = num(r[5]);
    d.holdings.push({
      id: r[1], tier: r[2], name: r[3],
      value: val, profit, profitPct: pct(r[6]),
      shorthand: r[7] || r[3],
      costBasis: val - profit,
      colorCode: parseInt(r[9]) || 0,
    });
  }
  d.totalGain = d.holdings.reduce((s, h) => s + h.profit, 0);

  // Sectors (rows 47, 49, 51, 53, 55, 57, 59, 61 → indices)
  d.sectors = [];
  for (let i = 47; i <= 62; i += 2) {
    const r = rows[i] || [];
    if (!r[0] || isNaN(parseInt(r[0]))) continue;
    d.sectors.push({ name: r[1] || '', alloc: pct(r[2]), dividend: pct(r[3]) });
  }

  // Dividend yield
  d.dividendYield = pct((rows[16] || [])[11]);

  // YTD gain, total gain, passive income — from portfolio new row 12 (0-indexed)
  const pf13 = (pfRows && pfRows[12] ? pfRows[12] : []).filter(c => c.trim() !== '');
  // non-empty values: [0]=totalNW, [1]=totalNW, [2]=NFA-mortgage, [3]=NFA, [4]=YTD, [5]=totalGain, [6]=passiveIncome
  d.ytdGain             = num(pf13[4] || '0');
  d.totalGain           = num(pf13[5] || '0');
  const piStr           = pf13[6] || '';
  const piParts         = piStr.split('/');
  d.passiveIncomeActual = num(piParts[0] || '0') || 524004;
  d.passiveIncomeTarget = num(piParts[1] || '0') || PASSIVE_INCOME_TARGET;

  return d;
}

function colorClass(val) { return val > 0 ? 'gain' : val < 0 ? 'loss' : 'neutral'; }
function sign(val) { return val > 0 ? '+' : ''; }
function trafficLight(actual, target, higherIsBad) {

        <div class="top-metric">
          <div class="top-metric-title">純金融資産 - 住宅ローン</div>
          <div class="top-metric-value loss">${fmt(nfaMinusMortgage)}</div>
        </div>
        <div class="top-metric">
          <div class="top-metric-title">純金融資産</div>
          <div class="top-metric-value gain">${fmt(d.netFinancialAssets)}</div>
        </div>
        <div class="top-metric">
          <div class="top-metric-title">YTD損益</div>
          <div class="top-metric-value ${colorClass(d.ytdGain)}">${sign(d.ytdGain)}${fmt(d.ytdGain)}</div>
        </div>
        <div class="top-metric">
          <div class="top-metric-title">全体損益</div>
          <div class="top-metric-value ${colorClass(d.totalGain)}">${sign(d.totalGain)}${fmt(d.totalGain)}</div>
        </div>
        <div class="top-metric">
          <div class="top-metric-title">年間パッシブ収入（実績/目標）</div>
          <div class="top-metric-value">${fmt(d.passiveIncomeActual)} / ${fmt(d.passiveIncomeTarget)}</div>
        </div>
      </div>

      <!-- Row 2: equation -->
      <div class="eq-row">
        <div class="eq-card">
          <div class="eq-title">純金融資産</div>
          <div class="eq-value gain">${fmt(d.netFinancialAssets)}</div>
          <div class="eq-sub">T0 + T1 + T2 + T3(a) + T3(b)</div>
          ${tierBar(nfaTiers)}
        </div>
        <div class="eq-op">+</div>
        <div class="eq-card">
          <div class="eq-title">不動産価値</div>
          <div class="eq-value gain">${fmt(d.realEstateValue)}</div>
          <div class="eq-sub">土地価格＋建物減価償却</div>
          ${tierBar([d.tiers[5]])}
        </div>
        <div class="eq-op" style="color:var(--red)">-</div>
        <div class="eq-card">
          <div class="eq-title">住宅ローン残高</div>
          <div class="eq-value loss">${fmt(d.mortgage)}</div>
          <div class="eq-sub">0.93% | 40年 | 元利金等</div>
          <div class="tier-bar"><span style="width:100%;background:var(--red)"></span></div>
        </div>
        <div class="eq-op">=</div>
        <div class="eq-card">
          <div class="eq-title">純資産合計</div>
          <div class="eq-value gain">${fmt(d.totalNetWorth)}</div>
          <div class="eq-sub">T0〜T4 全部合計</div>
          ${tierBar(allTiers)}
        </div>
      </div>`;
    })()}

    <!-- Asset Tiers -->
    <h2>資産 Tier</h2>
    <div class="card" style="padding:0;overflow-x:auto;">
      <table class="tier-table">
        <thead><tr>
          <th>Tier</th><th>カテゴリ</th><th>資産種別</th>
          <th style="text-align:right">金額</th>
          <th style="text-align:right">比率</th>
          <th style="min-width:120px"></th>
        </tr></thead>
        <tbody>
          ${d.tiers.map(t => `
          <tr>
            <td><span class="tier-badge ${t.color}">${t.id}</span></td>
            <td>${t.desc}</td>
            <td style="color:var(--muted);font-size:12px">${t.types}</td>
            <td style="text-align:right;font-variant-numeric:tabular-nums">${fmt(t.amount)}</td>
            <td style="text-align:right">${t.pctStr}</td>
            <td>
              <div class="pct-bar-wrap">
                <div class="pct-bar" style="width:${t.pctNum}px;max-width:120px"></div>
              </div>
            </td>
          </tr>`).join('')}
        </tbody>
        <tfoot>
          <tr>
            <td colspan="3" style="font-weight:700">合計</td>
            <td style="text-align:right;font-variant-numeric:tabular-nums">${fmt(d.totalNetWorth)}</td>
            <td style="text-align:right">100%</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>

    <!-- Leverage & Real Estate -->
    ${(()=>{
      function lc(metric) {
        if (metric === 'ltv')  return d.ltv.actual > 80       ? 'lev-red'    : d.ltv.actual > 70       ? 'lev-yellow' : 'lev-green';
        if (metric === 'nw')   return d.nwCoverage.actual < 35 ? 'lev-red'   : d.nwCoverage.actual < 50 ? 'lev-yellow' : 'lev-green';
        if (metric === 'di')   return d.debtIncome.val > 7     ? 'lev-red'   : d.debtIncome.val >= 5    ? 'lev-yellow' : 'lev-green';
        if (metric === 'dscr') return d.dscr.val >= 35          ? 'lev-red'   : d.dscr.val >= 30         ? 'lev-yellow' : 'lev-green';
      }
      function levCard(title, eq, actual, target, metric) {
        const cls = lc(metric);
        return `
          <div class="lev-card">
            <div class="lev-title">${title}</div>
            <div class="lev-eq">${eq}</div>
            <div class="lev-body">
              <div class="lev-actual ${cls}">${actual}</div>
              <div class="lev-target-col">
                <div class="lev-target-label">目標</div>
                <div class="lev-target-val ${cls}">${target}</div>
              </div>
            </div>
          </div>`;
      }
      return `
      <div class="lev-header">
        <h2>レバレッジ健全性</h2>
        <span class="lev-income">本年度年収：${fmtM(d.annualIncome)}</span>
      </div>
      <div class="leverage-grid">
        ${levCard('LTV（自己持分）',     d.ltv.eq,        d.ltv.result,        d.ltv.target,        'ltv')}
        ${levCard('純資産カバー率',       d.nwCoverage.eq, d.nwCoverage.result, d.nwCoverage.target, 'nw')}
        ${levCard('総責務÷年収',         d.debtIncome.eq, d.debtIncome.result, d.debtIncome.target, 'di')}
        ${levCard('返済比率（額面ベース）', d.dscr.eq,      d.dscr.result,       d.dscr.target,       'dscr')}
      </div>`;
    })()}

    <!-- Scorecard -->
    <h2>スコアカード</h2>
    ${(()=>{
      const sc = d.scorecard;
      function scColor(rawVal, passFn, warnFn, isNum) {
        const v = isNum ? num(rawVal) : pct(rawVal);
        if (passFn(v)) return 'sc-green';
        if (warnFn && warnFn(v)) return 'sc-yellow';
        return 'sc-red';
      }
      function scRow(label, target, display, cls) {
        return `<tr><td>${label}</td><td style="color:var(--muted)">${target}</td><td class="${cls}">${display}</td></tr>`;
      }
      const fmtMOne = v => '¥' + (v/1000000).toFixed(1) + 'M';
      const s0 = sc[0]||{}, s1 = sc[1]||{}, s2 = sc[2]||{}, s3 = sc[3]||{},
            s4 = sc[4]||{}, s5 = sc[5]||{}, s6 = sc[6]||{};
      return `
      <div class="card" style="padding:0;overflow-x:auto">
        <table class="sc-table">
          <thead><tr><th>項目</th><th>目標</th><th>実績</th></tr></thead>
          <tbody>
            <tr class="sc-section"><td colspan="3">──  運用資産（T1 + T2）割合  ──</td></tr>
            ${scRow('コア比率 (T1%)',      '>60%',   s0.rawVal||'', scColor(s0.rawVal||'', v=>v>=60, v=>v>=50, false))}
            ${scRow('分散度 (投信%)',      '>40%',   s1.rawVal||'', scColor(s1.rawVal||'', v=>v>=40, v=>v>=30, false))}
            ${scRow('集中度 (個別株%)',    '<40%',   s2.rawVal||'', scColor(s2.rawVal||'', v=>v<40,  v=>v<50,  false))}
            ${scRow('銘柄上限',            '<10%',   s3.rawVal||'', scColor(s3.rawVal||'', v=>v<10,  v=>v<12,  false))}
            ${scRow('銘柄上限（RSU除く）', '<5.0%',  '0.0%',        'sc-green')}
            <tr class="sc-section"><td colspan="3">──  配当周り・ガードレール  ──</td></tr>
            ${scRow('生活防衛資金（T0）',      '¥4.0M', fmtMOne(num(s4.rawVal||'0')), scColor(s4.rawVal||'0', v=>v>=4000000, v=>v>=3000000, true))}
            ${scRow('現金比率（HYSA÷T1）', '<30%',   s5.rawVal||'', scColor(s5.rawVal||'', v=>v<30,  v=>v<35,  false))}
            ${scRow('配当利回り',           '>2.5%',  s6.rawVal||'', scColor(s6.rawVal||'', v=>v>=2.5,v=>v>=2,  false))}
            <tr class="sc-section"><td colspan="3">──  NISA関係  ──</td></tr>
            ${scRow('2026年投資枠', '¥36M', d.nisa2026.pctStr, 'sc-yellow')}
            ${scRow('生涯投資枠',   '¥18M', d.nisaLife.pctStr,  'sc-yellow')}
          </tbody>
        </table>
      </div>`;
    })()}

    <!-- Sector Allocation -->
    <h2>セクター配分</h2>
    <div class="card">
      ${d.sectors.map(s => `
      <div class="sector-row">
        <div class="sector-name">${s.name}</div>
        <div class="sector-bar-bg">
          <div class="sector-bar-fill" style="width:${Math.min(100, s.alloc * 5)}%;background:${s.alloc >= 15 ? 'var(--red)' : s.alloc >= 13 ? 'var(--yellow)' : 'var(--green)'}"></div>
        </div>
        <div class="sector-pct">${s.alloc.toFixed(1)}%</div>
      </div>`).join('')}
    </div>

    <!-- Holdings -->
    <h2>保有銘柄一覧</h2>
    ${holdingsTable()}

    <div style="height:32px"></div>
  `;

  document.getElementById('dashboard').innerHTML = html;
  document.getElementById('dashboard-content').innerHTML = mainHtml;

  // Tab switching
  document.getElementById('tabDash').addEventListener('click', () => {
    document.getElementById('dashboard-content').style.display='block';
    document.getElementById('projection').style.display='none';
    document.getElementById('tabDash').classList.add('active');
    document.getElementById('tabProj').classList.remove('active');
  });
  document.getElementById('tabProj').addEventListener('click', () => {
    document.getElementById('dashboard-content').style.display='none';
    document.getElementById('projection').style.display='block';
    document.getElementById('tabDash').classList.remove('active');
    document.getElementById('tabProj').classList.add('active');
  });

  renderProjection(d, _history);

  function bindHoldingsEvents() {
    // Sort
    document.getElementById('htable').querySelector('thead').addEventListener('click', e => {
      const th = e.target.closest('th');
      if (!th || !th.dataset.key) return;
      if (sortKey === th.dataset.key) sortDir *= -1;
      else { sortKey = th.dataset.key; sortDir = 1; page = 0; }
      rebuildHoldings();
    });
    // Pagination
    document.getElementById('dashboard').addEventListener('click', e => {
      if (e.target.id === 'prevBtn' && page > 0) { page--; rebuildHoldings(); }
      if (e.target.id === 'nextBtn') { page++; rebuildHoldings(); }
    });
  }

  function rebuildHoldings() {
    const wrap = document.getElementById('htable').closest('.card');
    wrap.innerHTML = `
      ${paginationBar()}
      <div class="holdings-wrap" style="margin-top:8px">
        <table class="holdings-table" id="htable">
          <thead><tr>${
            [['tier','Tier'],['shorthand','銘柄'],['value','時価'],['costBasis','簿価'],['profit','損益'],['profitPct','損益率']]
            .map(([key,label]) => {
              const cls = sortKey === key ? (sortDir===1?'sort-asc':'sort-desc') : '';
              return `<th class="${cls}" data-key="${key}">${label}</th>`;
            }).join('')
          }</tr></thead>
          <tbody id="htbody">${holdingsRows()}</tbody>
          <tfoot><tr>
            <td colspan="2">合計 (${d.holdings.length}銘柄)</td>
            <td>${fmt(d.holdings.reduce((s,h)=>s+h.value,0))}</td>
            <td>${fmt(d.holdings.reduce((s,h)=>s+h.costBasis,0))}</td>
            <td class="${colorClass(d.totalGain)}">${sign(d.totalGain)}${fmt(d.totalGain)}</td>
            <td></td>
          </tr></tfoot>
        </table>
      </div>
      ${paginationBar()}`;
  }

  bindHoldingsEvents();

  // Refresh button
  document.getElementById('refreshBtn').addEventListener('click', () => loadAndRender());
}

function tierColorClass(tier) {
  const map = { 'T0':'t0','T1':'t1','T2':'t2','T3 (a)':'t3a','T3(a)':'t3a','T3 (b)':'t3b','T3(b)':'t3b','T4':'t4' };
  return map[tier] || 't0';
}

// ── Load & render ─────────────────────────────────────────────────────────────
async function loadAndRender() {
  const loadEl = document.getElementById('loading');
  const dashEl = document.getElementById('dashboard');
  const btn = document.getElementById('refreshBtn');
  if (btn) btn.disabled = true;
  loadEl.style.display = 'block';
  loadEl.textContent = 'データ読み込み中...';
  dashEl.style.display = 'none';
  try {
    const [cleanRes, pfRes, histRes] = await Promise.all([fetch(CLEAN_URL), fetch(PORTFOLIO_URL), fetch(HISTORY_URL)]);
    if (!cleanRes.ok) throw new Error(`HTTP ${cleanRes.status}`);
    const [cleanText, pfText, histText] = await Promise.all([cleanRes.text(), pfRes.text(), histRes.ok ? histRes.text() : Promise.resolve('')]);
    const data = extract(parseCSV(cleanText), parseCSV(pfText));
    _history = histText ? parseHistory(parseCSV(histText)) : [];
    loadEl.style.display = 'none';
    dashEl.style.display = 'block';
    render(data);
  } catch (err) {
    loadEl.innerHTML = `<div class="error-box">⚠️ データの読み込みに失敗しました: ${err.message}<br>スプレッドシートが公開設定になっているか確認してください。</div>`;
  }
}

loadAndRender();
</script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
