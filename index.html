function buildSummaryPayload(d, waterfallData) {
  const fireProgress = d.fireNumber > 0 ? (d.netFinancialAssets / d.fireNumber * 100).toFixed(1) : null;
  return {
    date: new Date().toLocaleDateString('en-US', {year:'numeric',month:'long',day:'numeric'}),
    totalNetWorth:       d.totalNetWorth,
    netFinancialAssets:  d.netFinancialAssets,
    fireNumber:          d.fireNumber,
    fireProgressPct:     fireProgress,
    retirementAge:       d.retirementAge,
    currentAge:          d.currentAge,
    monthlyIncome:       d.monthlyIncome,
    mortgage:            d.mortgage,
    leverage: {
      ltv:        d.ltv.actual,
      nwCoverage: d.nwCoverage.actual,
      debtIncome: d.debtIncome.val,
      dscr:       d.dscr.val
    },
    waterfallLast3: (waterfallData || []).slice(-3).map(w => ({
      month:           w.month,
      contributions:   Math.round(w.contrib),
      returns:         Math.round(w.returns),
      mortgagePaydown: Math.round(w.mortgagePaydown),
      reChange:        Math.round(w.reChange),
      total:           Math.round(w.total)
    }))
  };
}

async function regenerateSummary(d, waterfallData) {
  const btn = document.getElementById('aiGenerateBtn');
  if (!d.scriptUrl || !btn) return;

  const textEl = document.getElementById('aiSummaryText');
  function setMsg(html) { if (textEl) textEl.innerHTML = html; }

  btn.textContent = '⏳ Generating…';
  btn.disabled = true;
  setMsg('<span class="ai-placeholder">Triggering Gemini — reloading in 30 seconds…</span>');

  // Build URL params: feedback (fb) + MoM snapshot (mom)
  const fb  = buildFeedbackParam();
  const mom = buildMoMParam(waterfallData);
  const params = [];
  if (fb)  params.push('fb='  + encodeURIComponent(fb));
  if (mom) params.push('mom=' + encodeURIComponent(mom));
  const url = d.scriptUrl + (params.length ? '?' + params.join('&') : '');

  // Simple GET with no-cors — no body, no preflight, no redirect issues.
  // Apps Script reads all metrics directly from the sheet, so no data needed here.
  // We can't read the opaque response; instead we reload the sheet after a delay
  // to pick up the summary written to AB21/AB22 by the script.
  fetch(url, { mode: 'no-cors' }).catch(err => {
    console.error('[WealthTrack] Fetch failed:', err);
  });

  let secs = 30;
  const tick = setInterval(() => {
    secs--;
    if (secs > 0) {
      setMsg(`<span class="ai-placeholder">Waiting for Gemini… reloading in ${secs}s &nbsp;<span style="font-size:10px;color:var(--muted)">(check Apps Script execution logs if it fails)</span></span>`);
    } else {
      clearInterval(tick);
      setMsg('<span class="ai-placeholder">Reloading data…</span>');
      // Clear feedback — it's been sent to the prompt, fresh start after reload
      localStorage.removeItem('wt_ai_feedback');
      loadAndRender();
    }
  }, 1000);
}

// ── FIRE Progress Bar ─────────────────────────────────────────────────────────
function renderFireBar(d, container) {
  if (!d.fireNumber || d.fireNumber <= 0) {
    container.innerHTML=`<h2>FIRE 達成度</h2><div class="fire-card" style="color:var(--muted);font-size:12px">FIRE目標が未設定です（data clean シート AA22 に目標純金融資産額を入力してください）</div>`;
    return;
  }

  const nfa    = d.netFinancialAssets;
  const target = d.fireNumber;
  const pct    = Math.min(nfa / target * 100, 100);
  const remaining = Math.max(0, target - nfa);
  const isAchieved = nfa >= target;

  // Colour: red→yellow→green based on progress
  const fillColor = pct >= 100 ? 'var(--green)' : pct >= 66 ? '#3fb950' : pct >= 33 ? 'var(--yellow)' : 'var(--red)';

  // Significant round-number milestones that fall between current NFA and FIRE target
  const MILESTONES = [50e6, 100e6, 200e6, 300e6, 500e6];
  const visibleMilestones = MILESTONES.filter(m => m > 0 && m < target);

  const markerHtml = visibleMilestones.map(m => {
    const mpct = (m / target * 100).toFixed(2);
    return `<div class="fire-milestone" style="left:${mpct}%"></div>`;
  }).join('');

  // Labels: only show milestone labels that aren't too cramped (>8% apart from neighbours and edges)
  const labelPoints = [0, ...visibleMilestones.map(m => m/target*100), 100];
  const milestoneLabels = visibleMilestones.map((m, i) => {
    const mpct = m / target * 100;
    const prev = labelPoints[i], next = labelPoints[i + 2];
    if (mpct - prev < 8 || next - mpct < 8) return '';
    return `<span style="position:absolute;left:${mpct.toFixed(1)}%;transform:translateX(-50%);white-space:nowrap">¥${Math.round(m/1e6)}M</span>`;
  }).join('');

  // 4% rule (safe withdrawal rate) — annual + monthly, current vs at-goal
  const SWR = 0.04;
  const fmtY = v => '¥' + (v >= 1e7 ? (v/1e6).toFixed(1)+'M' : Math.round(v/1e4)+'万');
  const fmtM = v => '¥' + Math.round(v).toLocaleString('ja-JP');
  const curAnnual  = nfa * SWR;
  const curMonthly = curAnnual / 12;
  const tgtAnnual  = target * SWR;
  const tgtMonthly = tgtAnnual / 12;

  container.innerHTML = `
    <h2 style="margin-top:0">FIRE 達成度</h2>
    <div class="fire-card">
      <div class="fire-header">
        <div>
          <span class="fire-pct ${isAchieved?'gain':''}">${pct.toFixed(1)}%</span>
          <span class="fire-meta" style="margin-left:10px">${isAchieved ? '🎉 FIRE 達成！' : `残り ${fmt(remaining)}`}</span>
        </div>
        <div class="fire-meta" style="text-align:right">
          純金融資産 ${fmt(nfa)}<br>
          FIRE 目標 ${fmt(target)}
        </div>
      </div>
      <div class="fire-track" style="position:relative">
        <div class="fire-fill" style="width:${pct.toFixed(2)}%;background:${fillColor}"></div>
        ${markerHtml}
      </div>
      <div class="fire-labels" style="position:relative;height:16px">
        <span style="position:absolute;left:0">¥0</span>
        ${milestoneLabels}
        <span style="position:absolute;right:0">${fmt(target)}</span>
      </div>
      <div class="fire-swr">
        <div class="fire-swr-title">4% ルール 安全引き出し率</div>
        <div class="fire-swr-row">
          <span class="fire-swr-label">現在 (純金融資産 ${fmtY(nfa)} × 4%)</span>
          <span class="fire-swr-vals">${fmtM(curMonthly)}/月<span class="sep">·</span>${fmtM(curAnnual)}/年</span>
        </div>
        <div class="fire-swr-row">
          <span class="fire-swr-label">目標達成時 (${fmtY(target)} × 4%)</span>
          <span class="fire-swr-vals" style="color:var(--green)">${fmtM(tgtMonthly)}/月<span class="sep">·</span>${fmtM(tgtAnnual)}/年</span>
        </div>
      </div>
    </div>`;
}

// ── Monthly Waterfall ─────────────────────────────────────────────────────────
function buildWaterfallData(history) {
  if (!history || history.length < 2) return [];
  const finVal = r => (r.t1_index_value||0)+(r.t2_value||0)+(r.t3a_ideco_value||0)+(r.t0_value||0)+(r.t1_gold||0)+(r.t1_hysa||0)+(r.t3a_insurance||0)+(r.t3b_value||0);
  const costVal = r => (r.t1_index_cost||0)+(r.t2_cost||0)+(r.t3a_ideco_cost||0);
  const reVal   = r => (r.t4_land||0)+(r.t4_building||0);

  // Last entry per calendar month
  const monthMap = new Map();
  for (const row of history) {
    const key = `${row.date.getFullYear()}-${String(row.date.getMonth()+1).padStart(2,'0')}`;
    monthMap.set(key, row);
  }
  const months = [...monthMap.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,r])=>({k,r}));

  // Only 1 calendar month recorded — synthesise MTD entry from first vs last history row
  if (months.length < 2) {
    const p = history[0], c = history[history.length - 1];
    const t1Contrib  = (c.t1_index_cost||0)  - (p.t1_index_cost||0);
    const t2Contrib  = (c.t2_cost||0)         - (p.t2_cost||0);
    const t3aContrib = (c.t3a_ideco_cost||0)  - (p.t3a_ideco_cost||0);
    const contrib        = t1Contrib + t2Contrib + t3aContrib;
    const returns        = (finVal(c) - finVal(p)) - contrib;
    const mortgagePaydown= -((c.t4_mortgage||0) - (p.t4_mortgage||0));
    const reChange       = reVal(c) - reVal(p);
    return [{ month: months[0].k, contrib, t1Contrib, t2Contrib, t3aContrib,
              returns, mortgagePaydown, reChange,
              total: contrib + returns + mortgagePaydown + reChange, _mtd: true }];
  }

  const result = [];
  for (let i = 1; i < months.length; i++) {
    const p = months[i-1].r, c = months[i].r;
    const t1Contrib  = (c.t1_index_cost||0)  - (p.t1_index_cost||0);
    const t2Contrib  = (c.t2_cost||0)         - (p.t2_cost||0);
    const t3aContrib = (c.t3a_ideco_cost||0)  - (p.t3a_ideco_cost||0);
    const contrib        = t1Contrib + t2Contrib + t3aContrib;
    const returns        = (finVal(c) - finVal(p)) - contrib;
    const mortgagePaydown= -((c.t4_mortgage||0) - (p.t4_mortgage||0));
    const reChange       = reVal(c) - reVal(p);
    result.push({ month: months[i].k, contrib, t1Contrib, t2Contrib, t3aContrib,
                  returns, mortgagePaydown, reChange,
                  total: contrib + returns + mortgagePaydown + reChange });
  }
  return result.slice(-12);
}

function renderWaterfallChart(history, container) {
  const data = buildWaterfallData(history);
  if (!data.length) { container.innerHTML = ''; return; }

  const W=800,H=210,PL=68,PR=20,PT=14,PB=36;
  const cW=W-PL-PR, cH=H-PT-PB, n=data.length;
  const C = { contrib:'#58a6ff', t1:'#58a6ff', t2:'#d29922', t3a:'#34d399', retPos:'#3fb950', retNeg:'#f85149', mortgage:'#bc8cff', rePos:'#f0883e', reNeg:'#e8773c' };

  // Scale
  const allPosMax = Math.max(0,...data.map(d=>[d.contrib,d.returns,d.mortgagePaydown,d.reChange].filter(v=>v>0).reduce((s,v)=>s+v,0)));
  const allNegMin = Math.min(0,...data.map(d=>[d.contrib,d.returns,d.mortgagePaydown,d.reChange].filter(v=>v<0).reduce((s,v)=>s+v,0)));
  const pad = Math.max(Math.abs(allPosMax),Math.abs(allNegMin))*0.12||1;
  const dataMax=allPosMax+pad, dataMin=allNegMin-pad;
  const xs = i => PL+(i+0.5)/n*cW;
  const barW = Math.max(10, cW/n*0.55);
  const ys = v => PT+(1-(v-dataMin)/(dataMax-dataMin))*cH;
  const zero = ys(0);

  // Grid & labels
  let grid='',yLbl='';
  [-2,-1,0,1,2].forEach(t=>{
    const v=(t/2)*(t>=0?dataMax:-dataMin), y=ys(v).toFixed(1);
    grid+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="rgba(255,255,255,0.05)"/>`;
    if(Math.abs(v)>50000||v===0) yLbl+=`<text x="${PL-6}" y="${y}" text-anchor="end" dominant-baseline="middle" fill="#6b7888" font-size="10">${v===0?'0':(v/1000000).toFixed(1)+'M'}</text>`;
  });
  const zeroLine=`<line x1="${PL}" y1="${zero.toFixed(1)}" x2="${W-PR}" y2="${zero.toFixed(1)}" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>`;

  // Bars
  let bars='', xLbl='';
  data.forEach((d,i)=>{
    const cx=xs(i), x=(cx-barW/2).toFixed(1), bw=barW.toFixed(1);
    // Contributions split into T1/T2/T3a sub-segments, then returns, mortgage, RE
    const drivers=[
      {val:d.t1Contrib,      posC:C.t1,       negC:C.t1},
      {val:d.t2Contrib,      posC:C.t2,       negC:C.t2},
      {val:d.t3aContrib,     posC:C.t3a,      negC:C.t3a},
      {val:d.returns,        posC:C.retPos,   negC:C.retNeg},
      {val:d.mortgagePaydown,posC:C.mortgage, negC:C.mortgage},
      {val:d.reChange,       posC:C.rePos,    negC:C.reNeg},
    ];
    let posBase=0, negBase=0;
    drivers.forEach(({val,posC,negC})=>{
      if(val>0){ const y1=ys(posBase+val),y2=ys(posBase); bars+=`<rect x="${x}" y="${y1.toFixed(1)}" width="${bw}" height="${(y2-y1).toFixed(1)}" fill="${posC}" rx="2"/>`; posBase+=val; }
      else if(val<0){ const y1=ys(negBase),y2=ys(negBase+val); bars+=`<rect x="${x}" y="${y1.toFixed(1)}" width="${bw}" height="${(y2-y1).toFixed(1)}" fill="${negC}" rx="2" opacity="0.8"/>`; negBase+=val; }
    });
    const [yr,mo]=d.month.split('-');
    const moNum=parseInt(mo);
    const showYear=i===0||mo==='01';
    const label=d._mtd?`${moNum}月 MTD`:showYear?`'${yr.slice(2)}/${moNum}月`:`${moNum}月`;
    const isFirst=i===0, isLast=i===n-1;
    const anchor=isFirst?'start':isLast?'end':'middle';
    const lx=isFirst?Math.max(cx,PL+2):isLast?Math.min(cx,W-PR-2):cx;
    xLbl+=`<text x="${lx.toFixed(1)}" y="${H-PB+16}" text-anchor="${anchor}" fill="#6b7888" font-size="10">${label}</text>`;
  });

  const overlay=`<rect id="wfOverlay" x="${PL}" y="${PT}" width="${cW}" height="${cH}" fill="transparent" style="cursor:crosshair"/>`;
  const hair=`<line id="wfHair" x1="0" y1="${PT}" x2="0" y2="${H-PB}" stroke="rgba(255,255,255,0.25)" stroke-width="1" visibility="hidden"/>`;

  const isMtd = data.length===1 && data[0]._mtd;

  // NW velocity — rolling average of recent monthly totals
  const velSlice = data.slice(-3);
  const velAvg = velSlice.length ? velSlice.reduce((s,m)=>s+m.total,0)/velSlice.length : 0;
  const velColor = velAvg>=0 ? 'var(--green)' : 'var(--red)';
  const velLbl = velSlice.length>=3 ? '過去3ヶ月平均' : `過去${velSlice.length}ヶ月平均`;

  container.innerHTML=`<div class="wfall-card">
    <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap">
      <h2 style="margin:0">月次 NW 変動内訳${isMtd?' <span style="font-size:11px;font-weight:400;color:var(--muted)">(MTD)</span>':''}</h2>
      <div style="margin-left:auto;font-size:12px;color:var(--muted)">増加ペース&ensp;<span style="color:${velColor};font-weight:700;font-variant-numeric:tabular-nums">${velAvg>=0?'+':''}${fmt(velAvg)}<span style="font-size:10px;font-weight:400">/月</span></span>&ensp;<span style="font-size:10px">(${velLbl})</span></div>
    </div>
    <svg id="wfSvg" viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible">
      ${grid}${yLbl}${xLbl}${zeroLine}${bars}${hair}${overlay}
    </svg>
    <div class="wfall-legend">
      <div class="wfall-legend-item"><div class="wfall-legend-dot" style="background:${C.t1}"></div>T1 NISA</div>
      <div class="wfall-legend-item"><div class="wfall-legend-dot" style="background:${C.t2}"></div>T2 株式</div>
      <div class="wfall-legend-item"><div class="wfall-legend-dot" style="background:${C.t3a}"></div>T3a iDeCo</div>
      <div class="wfall-legend-item"><div class="wfall-legend-dot" style="background:${C.retPos}"></div>運用益</div>
      <div class="wfall-legend-item"><div class="wfall-legend-dot" style="background:${C.retNeg}"></div>運用損</div>
      <div class="wfall-legend-item"><div class="wfall-legend-dot" style="background:${C.mortgage}"></div>ローン返済</div>
      <div class="wfall-legend-item"><div class="wfall-legend-dot" style="background:${C.rePos}"></div>不動産変動</div>
    </div>
    <div id="wfTip" class="wfall-tip"></div>
  </div>`;

  container.style.position='relative';
  const svgEl=document.getElementById('wfSvg'), ovEl=document.getElementById('wfOverlay');
  const hlEl=document.getElementById('wfHair'), tipEl=document.getElementById('wfTip');
  if(!svgEl||!ovEl) return;

  ovEl.addEventListener('mousemove',e=>{
    const rect=svgEl.getBoundingClientRect(), scaleX=rect.width/W;
    const mxSvg=(e.clientX-rect.left)/scaleX;
    const i=Math.min(n-1,Math.max(0,Math.floor((mxSvg-PL)/cW*n)));
    const pt=data[i], cx=xs(i).toFixed(1);
    hlEl.setAttribute('x1',cx); hlEl.setAttribute('x2',cx); hlEl.setAttribute('visibility','visible');
    const [yr,mo]=pt.month.split('-');
    const fd=v=>(v>=0?'+':'')+fmt(v);
    const tipX=e.clientX-rect.left, tipY=e.clientY-rect.top, flip=tipX>rect.width*0.6;
    tipEl.style.left=flip?'auto':(tipX+12)+'px'; tipEl.style.right=flip?(rect.width-tipX+12)+'px':'auto';
    tipEl.style.top=Math.max(0,tipY-90)+'px';
    const pct=(v,tot)=>tot?` <span style="color:#6b7888;font-size:10px">(${Math.round(Math.abs(v)/Math.abs(tot)*100)}%)</span>`:'';
    const bkLine=(col,label,val,pctBase)=>val?`<div style="color:${col};margin-bottom:1px;padding-left:10px;font-size:11px">${label} ${fd(val)}${pct(val,pctBase)}</div>`:'';
    tipEl.innerHTML=`<div style="font-weight:700;color:#6b7888;margin-bottom:6px;font-size:11px">${yr}年${parseInt(mo)}月${pt._mtd?' MTD':''}　合計 <span style="color:${pt.total>=0?C.retPos:C.retNeg}">${fd(pt.total)}</span></div>`+
      (pt.contrib?`<div style="color:${C.t1};margin-bottom:1px">資金追加　　${fd(pt.contrib)}</div>`+
        bkLine(C.t1,  'T1 NISA  ', pt.t1Contrib,  pt.contrib)+
        bkLine(C.t2,  'T2 株式  ', pt.t2Contrib,  pt.contrib)+
        bkLine(C.t3a, 'T3a iDeCo', pt.t3aContrib, pt.contrib):'')+
      `<div style="color:${pt.returns>=0?C.retPos:C.retNeg};margin-bottom:2px;margin-top:${pt.contrib?'4':'0'}px">運用損益　　${fd(pt.returns)}</div>`+
      `<div style="color:${C.mortgage};margin-bottom:2px">ローン返済　${fd(pt.mortgagePaydown)}</div>`+
      (Math.abs(pt.reChange)>1000?`<div style="color:${C.rePos}">不動産変動　${fd(pt.reChange)}</div>`:'');
    tipEl.style.display='block';
  });
  ovEl.addEventListener('mouseleave',()=>{ hlEl.setAttribute('visibility','hidden'); tipEl.style.display='none'; });
}

// ── Mortgage Simulator ────────────────────────────────────────────────────────
function computeAmortization(balance, monthlyRate, payment, extra=0) {
  const arr=[balance]; let bal=balance;
  while(bal>0.01 && arr.length<700){ const interest=bal*monthlyRate; const principal=Math.min(payment+extra-interest,bal); if(principal<=0) break; bal=Math.max(0,bal-principal); arr.push(bal); }
  return arr;
}

// ── Passive Income History ────────────────────────────────────────────────────
function renderPassiveIncomeChart(history, d, container) {
  if (!container) return;

  // Last row per calendar month with passive_income > 0
  const monthMap = new Map();
  for (const r of history) {
    if (!r.passive_income) continue;
    const key = `${r.date.getFullYear()}-${String(r.date.getMonth()+1).padStart(2,'0')}`;
    monthMap.set(key, r.passive_income);
  }
  const data = [...monthMap.entries()].sort((a,b)=>a[0].localeCompare(b[0])).slice(-24);
  if (!data.length) { container.innerHTML = ''; return; }

  const target = d.passiveIncomeTarget || 0;
  const W=800, H=180, PL=68, PR=20, PT=14, PB=36;
  const cW=W-PL-PR, cH=H-PT-PB, n=data.length;
  const vals = data.map(d=>d[1]);
  const rawMax = Math.max(...vals, target||0);
  const pad = rawMax * 0.12 || 1e5;
  const dataMax = rawMax + pad;
  const xs = i => PL+(i+0.5)/n*cW;
  const barW = Math.max(10, cW/n*0.55);
  const ys = v => PT+(1-v/dataMax)*cH;

  // Grid lines
  let grid='', yLbl='';
  [0,.25,.5,.75,1].forEach(f => {
    const v=f*dataMax, y=ys(v).toFixed(1);
    grid+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="rgba(255,255,255,0.05)"/>`;
    yLbl+=`<text x="${PL-6}" y="${y}" text-anchor="end" dominant-baseline="middle" fill="#6b7888" font-size="10">${(v/1e6).toFixed(1)}M</text>`;
  });

  // Target line
  let targetLine = '';
  if (target > 0 && target <= dataMax) {
    const yt = ys(target).toFixed(1);
    targetLine = `<line x1="${PL}" y1="${yt}" x2="${W-PR}" y2="${yt}" stroke="rgba(63,185,80,0.5)" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="${W-PR+4}" y="${yt}" dominant-baseline="middle" fill="rgba(63,185,80,0.7)" font-size="9">目標</text>`;
  }

  // Bars + x-labels
  let bars='', xLbl='', tipData=[];
  data.forEach(([month, val], i) => {
    const cx=xs(i), x=(cx-barW/2).toFixed(1), bw=barW.toFixed(1);
    const top=ys(val).toFixed(1), h=(ys(0)-ys(val)).toFixed(1);
    const col = target>0 && val>=target ? '#3fb950' : '#58a6ff';
    bars+=`<rect x="${x}" y="${top}" width="${bw}" height="${h}" fill="${col}" rx="2" opacity="0.85"/>`;
    const [yr,mo]=month.split('-'), moNum=parseInt(mo);
    const showYear=i===0||mo==='01';
    const isFirst=i===0, isLast=i===n-1;
    const anchor=isFirst?'start':isLast?'end':'middle';
    const lx=isFirst?Math.max(cx,PL+2):isLast?Math.min(cx,W-PR-2):cx;
    xLbl+=`<text x="${lx.toFixed(1)}" y="${H-PB+16}" text-anchor="${anchor}" fill="#6b7888" font-size="10">${showYear?`'${yr.slice(2)}/`:''  }${moNum}月</text>`;
    tipData.push({ month, val, cx });
  });

  const overlay=`<rect id="piOverlay" x="${PL}" y="${PT}" width="${cW}" height="${cH}" fill="transparent" style="cursor:crosshair"/>`;
  const hair=`<line id="piHair" x1="0" y1="${PT}" x2="0" y2="${H-PB}" stroke="rgba(255,255,255,0.25)" stroke-width="1" visibility="hidden"/>`;

  container.innerHTML = `<h2>年間パッシブ収入の推移</h2>
  <div class="wfall-card" style="position:relative">
    <svg id="piSvg" viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible">
      ${grid}${yLbl}${targetLine}${bars}${hair}${overlay}
    </svg>
    <div id="piTip" class="wfall-tip"></div>
  </div>`;

  // Hover
  const svgEl=document.getElementById('piSvg');
  const ovEl=document.getElementById('piOverlay');
  const hlEl=document.getElementById('piHair');
  const tipEl=document.getElementById('piTip');
  if (!svgEl||!ovEl) return;

  ovEl.addEventListener('mousemove', e => {
    const rect=svgEl.getBoundingClientRect(), scaleX=rect.width/W;
    const mx=(e.clientX-rect.left)/scaleX;
    const i=Math.min(n-1,Math.max(0,Math.floor((mx-PL)/cW*n)));
    const pt=tipData[i];
    const cx=pt.cx.toFixed(1);
    hlEl.setAttribute('x1',cx); hlEl.setAttribute('x2',cx); hlEl.setAttribute('visibility','visible');
    const [yr,mo]=pt.month.split('-');
    const pctOfTarget = target>0 ? ` (目標の${(pt.val/target*100).toFixed(0)}%)` : '';
    const tipX=e.clientX-rect.left, flip=tipX>rect.width*0.6;
    tipEl.style.left=flip?'auto':(tipX+12)+'px';
    tipEl.style.right=flip?(rect.width-tipX+12)+'px':'auto';
    tipEl.style.top=Math.max(0,e.clientY-rect.top-60)+'px';
    tipEl.innerHTML=`<div style="font-weight:700;color:#6b7888;margin-bottom:4px;font-size:11px">${yr}年${parseInt(mo)}月</div>
      <div style="color:${target>0&&pt.val>=target?'var(--green)':'#58a6ff'};font-variant-numeric:tabular-nums">${fmt(pt.val)}${pctOfTarget}</div>`;
    tipEl.style.display='block';
  });
  ovEl.addEventListener('mouseleave', () => {
    hlEl.setAttribute('visibility','hidden');
    tipEl.style.display='none';
  });
}

function renderMortgageSimulator(d, container) {
  const balance=d.mortgage;
  const mr=MORTGAGE_RATE/12, n=MORTGAGE_TERM_YEARS*12;
  const factor=Math.pow(1+mr,n);
  const pmt=balance*mr*factor/(factor-1);
  const baseArr=computeAmortization(balance,mr,pmt,0);
  const baseMonths=baseArr.length-1;
  const baseTotalInterest=pmt*baseMonths-balance;

  function ym(months){ const d=new Date(); d.setMonth(d.getMonth()+months); return `${d.getFullYear()}年${d.getMonth()+1}月`; }

  function drawSim(extra){
    const accel=computeAmortization(balance,mr,pmt,extra);
    const accelMonths=accel.length-1;
    const accelInterest=(pmt+extra)*accelMonths-balance;
    const savedM=baseMonths-accelMonths, savedI=baseTotalInterest-accelInterest;

    document.getElementById('msimPayoff').textContent=ym(accelMonths);
    const smEl=document.getElementById('msimSavedM'), siEl=document.getElementById('msimSavedI');
    if(savedM>0){ smEl.textContent=`${Math.floor(savedM/12)}年${savedM%12}ヶ月`; smEl.style.color='var(--green)'; siEl.textContent=fmt(Math.round(savedI)); siEl.style.color='var(--green)'; }
    else { smEl.textContent='—'; smEl.style.color='var(--muted)'; siEl.textContent='—'; siEl.style.color='var(--muted)'; }

    // Chart
    const W=800,H=160,PL=68,PR=20,PT=10,PB=28, cW=W-PL-PR,cH=H-PT-PB;
    const maxM=baseArr.length;
    const xs=i=>PL+(i/(maxM-1))*cW, ys=v=>PT+(1-v/balance)*cH;
    const bp=baseArr.map((v,i)=>`${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(' ');
    const ap=accel.map((v,i)=>`${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(' ');
    let grid='',xLbl='',yLbl='';
    for(let yr=0;yr<=MORTGAGE_TERM_YEARS;yr+=5){ const x=xs(yr*12); const isFirst=yr===0,isLast=yr===MORTGAGE_TERM_YEARS; const anchor=isFirst?'start':isLast?'end':'middle'; const lx=isFirst?x+2:isLast?x-2:x; grid+=`<line x1="${x.toFixed(1)}" y1="${PT}" x2="${x.toFixed(1)}" y2="${H-PB}" stroke="rgba(255,255,255,0.04)"/>`; xLbl+=`<text x="${lx.toFixed(1)}" y="${H-PB+14}" text-anchor="${anchor}" fill="#6b7888" font-size="10">${yr}年</text>`; }
    for(let i=0;i<=3;i++){ const v=balance*i/3, y=ys(v).toFixed(1); grid+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="rgba(255,255,255,0.04)"/>`; yLbl+=`<text x="${PL-6}" y="${y}" text-anchor="end" dominant-baseline="middle" fill="#6b7888" font-size="10">${(v/1e6).toFixed(0)}M</text>`; }
    document.getElementById('msimChart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${grid}${yLbl}${xLbl}
      <polyline points="${bp}" fill="none" stroke="rgba(248,81,73,0.35)" stroke-width="1.5" stroke-dasharray="5,3"/>
      <polyline points="${ap}" fill="none" stroke="${extra>0?'#3fb950':'rgba(248,81,73,0.6)'}" stroke-width="2.5"/>
      <text x="${PL+6}" y="${PT+11}" fill="rgba(248,81,73,0.5)" font-size="9">元のペース</text>
      ${extra>0?`<text x="${xs(accelMonths).toFixed(1)}" y="${ys(0)+14}" fill="#3fb950" font-size="9" text-anchor="middle">完済</text>`:''}
    </svg>`;
  }

  container.innerHTML=`
    <h2 id="msimToggle" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none">
      住宅ローンシミュレーター
      <span id="msimChevron" style="font-size:9px;color:var(--muted);transition:transform .2s;display:inline-block">▶</span>
    </h2>
    <div id="msimBody" style="display:none">
      <div class="msim-card">
        <div class="msim-stats">
          <div class="msim-stat"><div class="msim-stat-label">残高</div><div class="msim-stat-val">${fmt(balance)}</div></div>
          <div class="msim-stat"><div class="msim-stat-label">月額返済</div><div class="msim-stat-val">${fmt(Math.round(pmt))}</div></div>
          <div class="msim-stat"><div class="msim-stat-label">残り期間</div><div class="msim-stat-val">${Math.floor(baseMonths/12)}年${baseMonths%12}ヶ月</div></div>
          <div class="msim-stat"><div class="msim-stat-label">残り利息</div><div class="msim-stat-val loss">${fmt(Math.round(baseTotalInterest))}</div></div>
        </div>
        <div class="msim-slider-row">
          <span class="msim-slider-label">毎月の追加返済</span>
          <input type="range" id="msimSlider" class="msim-slider" min="0" max="500000" step="10000" value="0">
          <span id="msimSliderVal" class="msim-slider-val">¥0</span>
        </div>
        <div class="msim-result">
          <div class="msim-result-item"><div class="msim-result-label">期間短縮</div><div id="msimSavedM" class="msim-result-val" style="color:var(--muted)">—</div></div>
          <div class="msim-result-item"><div class="msim-result-label">利息節約</div><div id="msimSavedI" class="msim-result-val" style="color:var(--muted)">—</div></div>
          <div class="msim-result-item"><div class="msim-result-label">完済予定</div><div id="msimPayoff" class="msim-result-val" style="color:var(--text);font-size:13px">${ym(baseMonths)}</div></div>
        </div>
        <div id="msimChart"></div>
        <div style="margin-top:8px;font-size:10px;color:var(--muted)">金利 ${(MORTGAGE_RATE*100).toFixed(2)}% ／ 元利金等払い ／ 現在残高ベースで計算</div>
      </div>
    </div>`;

  // Collapsible toggle
  let msimOpen = false;
  document.getElementById('msimToggle').addEventListener('click', () => {
    msimOpen = !msimOpen;
    const body = document.getElementById('msimBody');
    const chevron = document.getElementById('msimChevron');
    body.style.display = msimOpen ? 'block' : 'none';
    chevron.style.transform = msimOpen ? 'rotate(90deg)' : 'rotate(0deg)';
    if (msimOpen) { drawSim(0); }
  });

  const slider=document.getElementById('msimSlider'), valEl=document.getElementById('msimSliderVal');
  slider.addEventListener('input',()=>{ valEl.textContent='¥'+parseInt(slider.value).toLocaleString('ja-JP'); drawSim(parseInt(slider.value)); });
}

function buildHistoryChart(history, period) {
  if (!history || history.length < 2) return '<p style="color:var(--muted);text-align:center;padding:30px 0;font-size:12px">履歴データがありません</p>';

  // Compute total NW and cost basis per row
  function rowNW(r) {
    return (r.t1_index_value||0)+(r.t2_value||0)+(r.t3a_ideco_value||0)+(r.t4_land||0)+(r.t4_building||0)-(r.t4_mortgage||0)+(r.t0_value||0)+(r.t1_gold||0)+(r.t1_hysa||0)+(r.t3a_insurance||0)+(r.t3b_value||0);
  }
  function rowCost(r) {
    return (r.t1_index_cost||0)+(r.t2_cost||0)+(r.t3a_ideco_cost||0);
  }

  const all = history.map(r=>({date:r.date, nw:rowNW(r), cost:rowCost(r)})).filter(r=>r.nw!==0);
  if (!all.length) return '<p style="color:var(--muted);text-align:center;padding:30px 0;font-size:12px">履歴データがありません</p>';

  // Filter to period
  const now = new Date();
  let cutoff = null;
  if (period==='7D')  cutoff = new Date(now - 7*864e5);
  else if (period==='4W') cutoff = new Date(now - 28*864e5);
  else if (period==='YTD') cutoff = new Date(now.getFullYear(),0,1);
  else if (period==='1Y')  cutoff = new Date(now - 365*864e5);
  // 'All' = no cutoff
  const pts = cutoff ? all.filter(r=>r.date>=cutoff) : all;
  const data = pts.length >= 2 ? pts : all;

  const W=800, H=180, PL=0, PR=0, PT=10, PB=28;
  const cW=W-PL-PR, cH=H-PT-PB;
  const n=data.length;
  const nwVals=data.map(r=>r.nw), costVals=data.map(r=>r.cost);
  const allVals=[...nwVals,...costVals.filter(v=>v>0)];
  const minV=Math.min(...allVals)*0.995, maxV=Math.max(...allVals)*1.005;
  const xs=i=>PL+(i/(n-1))*cW, ys=v=>PT+(1-(v-minV)/(maxV-minV))*cH;

  const startNW=data[0].nw, endNW=data[data.length-1].nw;
  const delta=endNW-startNW, pct=startNW?delta/startNW*100:0;
  const isGain=delta>=0;
  const lineColor=isGain?'#3fb950':'#f85149';
  const gradId='hg'+Math.random().toString(36).slice(2,6);

  // NW polyline + gradient fill
  const nwPts=data.map((r,i)=>`${xs(i).toFixed(1)},${ys(r.nw).toFixed(1)}`).join(' ');
  const fillPts=`${xs(0).toFixed(1)},${H-PB} `+nwPts+` ${xs(n-1).toFixed(1)},${H-PB}`;
  // Cost basis line (dashed, muted)
  const costPts=data.filter(r=>r.cost>0);
  let costLine='';
  if(costPts.length>=2){
    const cpStr=data.map((r,i)=>r.cost>0?`${xs(i).toFixed(1)},${ys(r.cost).toFixed(1)}`:null).filter(Boolean).join(' ');
    costLine=`<polyline points="${cpStr}" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="4,3" stroke-linejoin="round"/>`;
  }

  // X axis labels — smart anchoring to prevent edge clipping
  let xLbls='';
  const labelIdxs=[0, Math.floor(n/4), Math.floor(n/2), Math.floor(3*n/4), n-1];
  const seen=new Set();
  labelIdxs.forEach((idx,pos)=>{
    const lbl=data[idx].date.toLocaleDateString('ja-JP',{month:'short',day:'numeric'});
    if(seen.has(lbl))return; seen.add(lbl);
    const isFirst=pos===0, isLast=pos===labelIdxs.length-1||idx===n-1;
    const anchor=isFirst?'start':isLast?'end':'middle';
    const x=isFirst?xs(idx)+2:isLast?xs(idx)-2:xs(idx);
    xLbls+=`<text x="${x.toFixed(1)}" y="${H-4}" text-anchor="${anchor}" fill="#6b7888" font-size="10">${lbl}</text>`;
  });

  // Interactive overlay
  const overlayRect=`<rect id="hcOverlay" x="${PL}" y="${PT}" width="${cW}" height="${cH}" fill="transparent" style="cursor:crosshair"/>`;
  const hairline=`<line id="hcHair" x1="${PL}" y1="${PT}" x2="${PL}" y2="${H-PB}" stroke="rgba(255,255,255,0.25)" stroke-width="1" visibility="hidden"/>`;
  const dot=`<circle id="hcDot" r="4" fill="${lineColor}" stroke="#0a0c13" stroke-width="2" visibility="hidden"/>`;

  const svgStr=`<svg id="hcSvg" class="hchart-svg" viewBox="0 0 ${W} ${H}">
  <defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="${lineColor}" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="${lineColor}" stop-opacity="0.02"/>
  </linearGradient></defs>
  <polygon points="${fillPts}" fill="url(#${gradId})"/>
  ${costLine}
  <polyline points="${nwPts}" fill="none" stroke="${lineColor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  ${xLbls}${hairline}${dot}${overlayRect}
  </svg><div id="hcTip" class="hchart-tip"></div>`;

  // Serialise data for interaction
  return {svgStr, data, endNW, delta, pct, isGain, W, H, PL, PT, PB, cW, cH};
}

function setupHChartInteraction(info) {
  const {data,W,H,PL,PT,PB,cW,cH} = info;
  const n=data.length;
  const nwVals=data.map(r=>r.nw), costVals=data.map(r=>r.cost);
  const allVals=[...nwVals,...costVals.filter(v=>v>0)];
  const minV=Math.min(...allVals)*0.995, maxV=Math.max(...allVals)*1.005;
  const xs=i=>PL+(i/(n-1))*cW, ys=v=>PT+(1-(v-minV)/(maxV-minV))*cH;

  const svg=document.getElementById('hcSvg');
  const ov=document.getElementById('hcOverlay');
  const hl=document.getElementById('hcHair');
  const dot=document.getElementById('hcDot');
  const tip=document.getElementById('hcTip');
  const valEl=document.getElementById('hcVal');
  const dltEl=document.getElementById('hcDelta');
  if(!svg||!ov) return;

  const startNW=data[0].nw;

  ov.addEventListener('mousemove', e=>{
    const rect=svg.getBoundingClientRect();
    const scaleX=rect.width/W;
    const mxSvg=(e.clientX-rect.left)/scaleX;
    const frac=Math.max(0,Math.min(1,(mxSvg-PL)/cW));
    const i=Math.round(frac*(n-1));
    const pt=data[i];
    const hx=xs(i).toFixed(1);

    hl.setAttribute('x1',hx);hl.setAttribute('x2',hx);hl.setAttribute('visibility','visible');
    dot.setAttribute('cx',hx);dot.setAttribute('cy',ys(pt.nw).toFixed(1));dot.setAttribute('visibility','visible');

    // Update header values on hover
    if(valEl){valEl.textContent=fmt(pt.nw);}
    const d=pt.nw-startNW, p=startNW?d/startNW*100:0;
    if(dltEl){
      dltEl.textContent=(d>=0?'+':'')+fmt(d)+' ('+(p>=0?'+':'')+p.toFixed(2)+'%)';
      dltEl.className='hchart-delta '+(d>=0?'gain':'loss');
    }

    const tipX=e.clientX-rect.left, tipY=e.clientY-rect.top;
    const flipLeft=tipX>rect.width*0.6;
    tip.style.left=flipLeft?'auto':(tipX+12)+'px';
    tip.style.right=flipLeft?(rect.width-tipX+12)+'px':'auto';
    tip.style.top=Math.max(0,tipY-60)+'px';
    const lbl=pt.date.toLocaleDateString('ja-JP',{year:'numeric',month:'short',day:'numeric'});
    tip.innerHTML=`<div style="font-size:11px;color:#6b7888;margin-bottom:4px;font-weight:700">${lbl}</div>`+
      `<div style="margin-bottom:2px">純資産 ${fmt(pt.nw)}</div>`+
      (pt.cost>0?`<div style="color:rgba(255,255,255,0.4)">簿価合計 ${fmt(pt.cost)}</div>`:'');
    tip.style.display='block';
  });

  ov.addEventListener('mouseleave',()=>{
    hl.setAttribute('visibility','hidden');
    dot.setAttribute('visibility','hidden');
    tip.style.display='none';
    // Reset to current
    if(valEl) valEl.textContent=fmt(info.endNW);
    if(dltEl){
      const d=info.delta,p=info.pct;
      dltEl.textContent=(d>=0?'+':'')+fmt(d)+' ('+(p>=0?'+':'')+p.toFixed(2)+'%)';
      dltEl.className='hchart-delta '+(d>=0?'gain':'loss');
    }
  });
}

function renderProjection(d, history, precomputedRates) {
  const el=document.getElementById('projection'); if(!el) return;
  const histDays=history.length;
  // Reuse rates computed in loadAndRender when available; only recompute if missing
  const rates=precomputedRates!==undefined?precomputedRates:(history.length>=2?computeRates(history):null);

  const BUCKET_LABELS={t1_index:'T1 Index funds',t2:'T2 Stocks',t3a_ideco:'T3(a) iDeCo',t4:'T4 Real estate equity',t0:'T0 Cash',t1_hysa:'T1 HYSA',t1_gold:'T1 Gold',t3a_insurance:'T3(a) Insurance',t3b:'T3(b) 529'};
  const HAS_CONTRIB=['t1_index','t2','t3a_ideco'];

  const currentFromHistory=(key)=>{
    if(!history.length) return 0;
    const l=history[history.length-1];
    if(key==='t4') return (l.t4_land||0)+(l.t4_building||0)-(l.t4_mortgage||0);
    const colMap={t1_index:'t1_index_value',t2:'t2_value',t3a_ideco:'t3a_ideco_value',t0:'t0_value',t1_hysa:'t1_hysa',t1_gold:'t1_gold',t3a_insurance:'t3a_insurance',t3b:'t3b_value'};
    return l[colMap[key]]||0;
  };

  const warnHtml=histDays<30
    ?`<div class="proj-warning red">Not enough data (${histDays} day${histDays!==1?'s':''} recorded) — enter rates manually to preview a projection, or wait until 30 days have been captured.</div>`
    :histDays<365
    ?`<div class="proj-warning yellow">Limited data (${histDays} days) — estimates may not reflect full annual contribution patterns.</div>`:'';

  // Rate assumptions table
  const dataBadge = histDays>=365
    ? `<span class="rate-badge ok">${histDays}d</span>`
    : histDays>=30
    ? `<span class="rate-badge warn">⚠ ${histDays}d</span>`
    : `<span class="rate-badge err">⚠ ${histDays}d — insufficient</span>`;

  const rateRows = Object.entries(BUCKET_LABELS).map(([key, label]) => {
    const r = rates && rates[key];
    const cv = r ? r.currentValue : currentFromHistory(key);
    if (!cv && key !== 't4') return ''; // skip empty buckets except T4
    const base = r ? r.annualBase : null;
    const sigma = r ? r.annualSigma : null;
    const clampBadge = (r && (r._baseClamped || r._sigmaClamped))
      ? `<span title="Rate clamped to ±25%/yr to keep projection realistic" style="color:var(--yellow);margin-left:4px;cursor:help">⚠</span>`
      : '';
    const baseStr = base !== null
      ? `<span style="color:${base>=0?'var(--green)':'var(--red)'}">${base>=0?'+':''}${(base*100).toFixed(1)}%</span>${clampBadge}`
      : `<span style="color:var(--muted)">—</span>`;
    const sigmaStr = sigma !== null && sigma > 0
      ? `<span style="color:var(--muted)">±${(sigma*100).toFixed(1)}%</span>`
      : `<span style="color:var(--muted)">—</span>`;
    let contribCell = '—';
    if (key === 't4' && r) {
      const payoff = r._paydownStartOffset > 0
        ? `<span style="font-size:10px;color:var(--muted)">from Jun 2026</span>`
        : '';
      contribCell = r.monthlyContrib > 0
        ? `<span style="color:var(--blue)">¥${Math.round(r.monthlyContrib).toLocaleString()}/mo</span> ${payoff}`
        : `<span style="color:var(--muted)">—</span>`;
    } else if (r && r.monthlyContrib > 0) {
      contribCell = `<span style="color:var(--blue)">¥${Math.round(r.monthlyContrib).toLocaleString()}/mo</span>`;
    }
    return `<tr><td>${label}</td><td>${baseStr}</td><td>${sigmaStr}</td><td>${contribCell}</td></tr>`;
  }).join('');

  const rateTableHtml = `
  <details class="proj-rates-wrap">
    <summary>Rate assumptions ${dataBadge}</summary>
    <div class="card" style="padding:0;overflow-x:auto">
      <table class="proj-rates-tbl">
        <thead><tr><th style="text-align:left">Bucket</th><th>Ann. return</th><th>±σ / yr</th><th style="text-align:left">Monthly contrib</th></tr></thead>
        <tbody>${rateRows}</tbody>
      </table>
    </div>
    ${histDays<30?`<div style="font-size:11px;color:var(--red);margin-top:6px">⚠ Rates shown are estimated from ${histDays} day${histDays!==1?'s':''} of data and are not reliable. Use manual mode for meaningful projections.</div>`:''}
  </details>`;

  const manualCardsHtml=Object.entries(BUCKET_LABELS).map(([key,label])=>{
    const r=rates&&rates[key];
    const defContrib=r?Math.round(r.monthlyContrib):0;
    const defRate=r?(r.annualBase*100).toFixed(1):'5.0';
    return `<div class="manual-card">
      <div class="manual-card-title">${label}</div>
      ${HAS_CONTRIB.includes(key)?`<div class="manual-row"><label>¥/month</label><input id="mr_c_${key}" type="number" value="${defContrib}" step="10000"></div>`:''}
      <div class="manual-row"><label>Return %</label><input id="mr_r_${key}" type="number" value="${defRate}" step="0.1"></div>
    </div>`;
  }).join('');

  const nowYM=(()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;})();
  function horizonYM(yrs){const n=new Date();let y=n.getFullYear()+yrs,m=n.getMonth()+1;return `${y}-${String(m).padStart(2,'0')}`;}
  const defaultHorizon=10;

  el.innerHTML=`
    ${warnHtml}
    <div class="proj-inputs">
      <div class="proj-group">
        <span class="proj-label">Time horizon — <span id="pHL">10 years</span></span>
        <input type="range" id="pHorizon" min="1" max="30" value="10">
      </div>
      <div class="proj-group">
        <span class="proj-label">Contributions</span>
        <select id="pContrib" class="proj-select">
          <option value="auto">Historical pace</option>
          <option value="manual">Manual input</option>
        </select>
      </div>
      <div class="proj-group" id="pStopGroup">
        <span class="proj-label">Stop contributing from</span>
        <input type="month" id="pStopDate" class="proj-number" value="${horizonYM(defaultHorizon)}">
      </div>
      <div class="proj-group">
        <span class="proj-label">NW target (¥)</span>
        <input type="number" id="pTarget" class="proj-number" placeholder="e.g. 100000000" step="1000000">
      </div>
      <div class="proj-group" style="justify-content:flex-end">
        <label style="display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12px;color:var(--muted)">
          <input type="checkbox" id="pExcludeRE" style="accent-color:var(--blue);cursor:pointer">
          Exclude real estate (mortgage as liability)
        </label>
      </div>
    </div>
    <div id="pManual" style="display:none"><h2>Manual rates</h2><div class="manual-grid">${manualCardsHtml}</div></div>
    ${rateTableHtml}
    <div id="pLegend" style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:6px;font-size:11px;color:var(--muted);padding:2px 0;letter-spacing:.02em">
      <span style="display:flex;align-items:center;gap:6px"><svg width="10" height="10" style="flex-shrink:0"><circle cx="5" cy="5" r="4" fill="#3fb950"/></svg>Optimistic</span>
      <span style="display:flex;align-items:center;gap:6px"><svg width="20" height="10" style="flex-shrink:0"><line x1="0" y1="5" x2="20" y2="5" stroke="#58a6ff" stroke-width="2.5"/></svg>Base</span>
      <span style="display:flex;align-items:center;gap:6px"><svg width="10" height="10" style="flex-shrink:0"><circle cx="5" cy="5" r="4" fill="#f85149"/></svg>Pessimistic</span>
      <span title="-30% drop on T1 index, T2 stocks, T3a iDeCo in year 1, then base-rate recovery" style="display:flex;align-items:center;gap:6px"><svg width="20" height="10" style="flex-shrink:0"><line x1="0" y1="5" x2="20" y2="5" stroke="rgba(139,148,158,0.85)" stroke-width="2" stroke-dasharray="2,3"/></svg>Worst case</span>
      <span id="pLegendCoast" style="display:none;align-items:center;gap:6px"><svg width="20" height="10" style="flex-shrink:0"><line x1="0" y1="5" x2="20" y2="5" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="5,3"/></svg>Coast FIRE</span>
    </div>
    <div class="card" style="padding:6px 6px 0"><div id="pChart"></div><div id="pAnnotation" style="padding:4px 6px 8px;font-size:12px"></div></div>
    <div id="pLongWarn" style="display:none;margin-top:6px;font-size:11px;color:var(--yellow)">⚠ Long projection with limited history</div>
    <div class="card" style="padding:0;overflow-x:auto;margin-top:10px">
      <table class="proj-table">
        <thead><tr><th style="text-align:left">Bucket</th><th>Current</th><th>Projected</th><th>Capital added</th><th>Returns</th><th>Ann. rate</th></tr></thead>
        <tbody id="pTbody"></tbody>
        <tfoot><tr id="pTfoot"></tr></tfoot>
      </table>
    </div>
    <div style="height:32px"></div>`;

  function monthsFromNow(yyyyMM){
    if(!yyyyMM) return Infinity;
    const[y,m]=yyyyMM.split('-').map(Number), n=new Date();
    return (y-n.getFullYear())*12+(m-1-n.getMonth());
  }

  function rebuild(){
    const yrs=parseInt(document.getElementById('pHorizon').value)||10;
    const mode=document.getElementById('pContrib').value;
    const stopDate=document.getElementById('pStopDate')?.value||'';
    const stopMonths=Math.max(0, monthsFromNow(stopDate));
    const target=parseFloat((document.getElementById('pTarget').value||'0').replace(/[¥,]/g,''))||0;
    const excludeRE=document.getElementById('pExcludeRE')?.checked||false;
    const months=yrs*12;
    document.getElementById('pHL').textContent=yrs+' year'+(yrs!==1?'s':'');
    document.getElementById('pManual').style.display=mode==='manual'?'block':'none';
    if(document.getElementById('pStopGroup')) document.getElementById('pStopGroup').style.display=mode==='auto'?'flex':'none';

    // Build rates to use
    let pr={};
    for(const key of Object.keys(BUCKET_LABELS)){
      const r=rates&&rates[key];
      const cv=r?r.currentValue:currentFromHistory(key);
      let annualBase=r?r.annualBase:0.05, annualSigma=r?r.annualSigma:0, monthlyContrib=r?r.monthlyContrib:0;
      if(mode==='manual'){
        const rc=document.getElementById(`mr_c_${key}`), rr=document.getElementById(`mr_r_${key}`);
        if(rr) annualBase=(parseFloat(rr.value)||0)/100;
        if(rc) monthlyContrib=parseFloat(rc.value)||0;
        annualSigma=0;
      }
      pr[key]={annualBase,annualSigma,monthlyContrib,currentValue:cv,
               // carry T4-specific paydown metadata for the split projection formula
               _propertyValue:r?r._propertyValue:undefined,
               _mortgageBalance:r?r._mortgageBalance:undefined,
               _paydownStartOffset:r?r._paydownStartOffset:undefined};
    }

    // RE exclusion: replace T4 equity with mortgage-as-liability (linear paydown)
    if(excludeRE){
      const mortBal=(rates&&rates.t4&&rates.t4._mortgageBalance)||
                    (history.length?history[history.length-1].t4_mortgage||0:0);
      const monthlyPaydown=(rates&&rates.t4&&rates.t4._monthlyPaydown)||0;
      pr.t4={annualBase:0,annualSigma:0,monthlyContrib:0,currentValue:-mortBal,_isLinearPaydown:true,_monthlyPaydown:monthlyPaydown};
    }

    if(!Object.values(pr).some(r=>r.currentValue!==0)){
      document.getElementById('pChart').innerHTML='<p style="color:var(--muted);text-align:center;padding:40px">No data available yet.</p>';
      return;
    }

    const projData=buildProjection(pr,months,stopMonths);
    const currentNW=projData[0].base;

    // Annotations
    let ann='';
    if(excludeRE){
      // Find when NFA crosses zero (net of mortgage)
      const crossZero=projData.find(p=>p.base>=0);
      ann=crossZero
        ?`<span style="font-size:12px;color:var(--green)">純金融資産 net zero reached in ${Math.floor(crossZero.month/12)}y ${crossZero.month%12}m</span>`
        :`<span style="font-size:12px;color:var(--muted)">純金融資産 net zero not reached within ${yrs} years</span>`;
    } else if(target>0){
      const hit=projData.find(p=>p.base>=target);
      ann=hit?`<span style="font-size:12px;color:var(--green)">📈 Base reaches target in ${Math.floor(hit.month/12)}y ${hit.month%12}m</span>`
             :`<span style="font-size:12px;color:var(--muted)">Base scenario does not reach target within ${yrs} years</span>`;
    }
    const longWarn=document.getElementById('pLongWarn');
    if(longWarn) longWarn.style.display=months>histDays*5?'block':'none';
    document.getElementById('pAnnotation').innerHTML=ann;

    // Coast FIRE curve: NW needed at month m to reach fireNumber by retirement without contributions
    let coastCurve = null;
    if(d.fireNumber > 0 && d.retirementAge > 0 && d.currentAge > 0 && !excludeRE) {
      const yearsToRetire = d.retirementAge - d.currentAge;
      const totalRetireMonths = yearsToRetire * 12;
      // Use base annual return across all buckets (weighted by current value)
      const totalCV = Object.values(pr).reduce((s,r)=>s+Math.max(0,r.currentValue),0);
      const weightedRate = totalCV > 0
        ? Object.values(pr).reduce((s,r)=>s + Math.max(0,r.currentValue)/totalCV * r.annualBase, 0)
        : 0.05;
      const mr = weightedRate / 12;
      // At each projection month m: coast NW = fireNumber / (1+mr)^(remainingMonths-m)
      coastCurve = projData.map(p => {
        const remaining = totalRetireMonths - p.month;
        if (remaining <= 0) return d.fireNumber;
        return mr > 0 ? d.fireNumber / Math.pow(1 + mr, remaining) : d.fireNumber;
      });
      // Annotate when base line crosses coast FIRE curve
      const coastCross = projData.find((p, i) => coastCurve[i] !== undefined && p.base >= coastCurve[i]);
      if (coastCross) {
        const ci = projData.indexOf(coastCross);
        ann += (ann?'&ensp;':'') + `<span style="font-size:12px;color:#f0883e">🏖 Coast FIRE in ${Math.floor(coastCross.month/12)}y ${coastCross.month%12}m — contributions optional from then</span>`;
      }
    }

    document.getElementById('pChart').innerHTML=buildChart(projData,currentNW,(!excludeRE&&target)||null,coastCurve);
    setupChartInteraction(projData);
    const coastLegEl=document.getElementById('pLegendCoast');
    if(coastLegEl) coastLegEl.style.display=coastCurve&&coastCurve.length?'flex':'none';

    // Summary table
    let totalCur=0,totalProj=0,totalCap=0,totalRet=0;
    document.getElementById('pTbody').innerHTML=Object.entries(BUCKET_LABELS).map(([key,label])=>{
      const r=pr[key]; if(!r||r.currentValue===0) return '';
      let proj, cap;
      if (r._isLinearPaydown) {
        proj = Math.min(0, r.currentValue + months * r._monthlyPaydown);
        cap  = 0;
      } else if (key==='t4' && r._propertyValue!==undefined) {
        const payMo = Math.max(0, months - (r._paydownStartOffset||0));
        const mortFV = Math.max(0, r._mortgageBalance - r.monthlyContrib * payMo);
        proj = projectBucket(r._propertyValue, 0, r.annualBase, months) - mortFV;
        cap  = r.monthlyContrib * payMo; // total principal paid over period
      } else {
        proj = projectBucket(r.currentValue, r.monthlyContrib, r.annualBase, months);
        cap  = r.monthlyContrib * Math.min(months, stopMonths);
      }
      const ret=proj-r.currentValue-cap;
      totalCur+=r.currentValue; totalProj+=proj; totalCap+=cap; totalRet+=ret;
      const rowLabel=excludeRE&&key==='t4'?'T4 Mortgage (liability)':label;
      return `<tr><td>${rowLabel}</td><td>${fmt(r.currentValue)}</td><td>${fmt(proj)}</td><td class="gain">${cap?'+'+fmt(cap):'—'}</td><td class="${colorClass(ret)}">${sign(ret)}${fmt(ret)}</td><td style="color:var(--muted)">${r._isLinearPaydown?'linear paydown':(r.annualBase*100).toFixed(1)+'%'}</td></tr>`;
    }).join('');
    document.getElementById('pTfoot').innerHTML=`<td>Total (${excludeRE?'純金融資産':'NW'})</td><td>${fmt(totalCur)}</td><td>${fmt(totalProj)}</td><td class="gain">${totalCap?'+'+fmt(totalCap):'—'}</td><td class="${colorClass(totalRet)}">${sign(totalRet)}${fmt(totalRet)}</td><td></td>`;
  }

  // Track whether user has manually overridden the stop date
  let stopDateUserSet=false;
  const stopDateEl=document.getElementById('pStopDate');
  if(stopDateEl) stopDateEl.addEventListener('change',()=>{ stopDateUserSet=true; });

  const horizonEl=document.getElementById('pHorizon');
  if(horizonEl) horizonEl.addEventListener('input',()=>{
    if(!stopDateUserSet && stopDateEl){
      const yrs=parseInt(horizonEl.value)||10;
      stopDateEl.value=horizonYM(yrs);
    }
    rebuild();
  });

  ['pContrib','pStopDate','pTarget','pExcludeRE'].forEach(id=>{
    const el=document.getElementById(id); if(!el) return;
    el.addEventListener('input',rebuild); el.addEventListener('change',rebuild);
  });
  document.querySelectorAll('.manual-card input').forEach(el=>el.addEventListener('input',rebuild));
  rebuild();
}

// ── CSV parser (handles quoted fields) ───────────────────────────────────────
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (c === '"') inQ = false;
      else field += c;
    } else {
      if (c === '"') { inQ = true; }
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c !== '\r') field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function num(s) { return parseFloat(String(s).replace(/[¥,x\s]/g, '')) || 0; }
function pct(s) { return parseFloat(String(s).replace('%','')) || 0; }
function fmt(n)  { return '¥' + Math.round(n).toLocaleString('ja-JP'); }
function fmtM(n) { return '¥' + (n/1000000).toFixed(2) + 'M'; }
function fmtK(n) { return '¥' + Math.round(n/1000) + 'k'; }

// ── Extract data from parsed CSV rows ────────────────────────────────────────
function extract(rows, pfRows) {
  const d = {};

  // Row 0: exchange rate
  d.exchangeRate = parseFloat(rows[0][0]) || 158.7;

  // Rows 10-15: tiers (T0–T4), row 16: total, row 17: goal
  const tierDefs = [
    { id:'T0', color:'t0', labelEn:'Liquidity Buffer' },
    { id:'T1', color:'t1', labelEn:'Core Portfolio' },
    { id:'T2', color:'t2', labelEn:'Satellite' },
    { id:'T3(a)', color:'t3a', labelEn:'Restricted (Retirement)' },
    { id:'T3(b)', color:'t3b', labelEn:'Conditional Assets' },
    { id:'T4', color:'t4', labelEn:'Real Estate' },
  ];
  d.tiers = tierDefs.map((def, i) => {
    const r = rows[10 + i] || [];
    return {
      ...def,
      desc: r[2] || '',
      types: r[3] || '',
      amount: num(r[4]),
      pctNum: pct(r[5]),
      pctStr: r[5] || '',
    };
  });
  d.totalNetWorth = num((rows[16] || [])[4]);
  d.netFinancialAssets = d.totalNetWorth - d.tiers[5].amount;

  // Scorecard (same tier rows, cols 10-11)
  d.scorecard = d.tiers.slice(0, 7).map((_, i) => {
    const r = rows[10 + i] || [];
    const name = r[10] || '';
    const rawVal = r[11] || '';
    const def = SCORECARD_TARGETS[i];
    if (!name) return null;
    const numVal = def.isNum ? num(rawVal) : pct(rawVal);
    return { name, rawVal, numVal, ...def, pass: def.pass(numVal) };
  }).filter(Boolean);

  // NISA rows 17-18
  const nisaRow = rows[17] || [];
  const lifetimeRow = rows[18] || [];
  d.nisa2026  = { name: nisaRow[10] || '2026年枠',    pctStr: nisaRow[11] || '', used: num(nisaRow[12]),   limit: num(nisaRow[13]) };
  d.nisaLife  = { name: lifetimeRow[10] || '生涯投資枠', pctStr: lifetimeRow[11] || '', used: num(lifetimeRow[12]), limit: num(lifetimeRow[13]) };

  // FIRE & retirement (AA21=rows[20][26], AA22=rows[21][26], AA23=rows[22][26])
  d.retirementAge = num((rows[20]||[])[26]);
  d.fireNumber    = num((rows[21]||[])[26]);  // NFA target (excl. real estate)
  d.currentAge    = num((rows[22]||[])[26]);
  // Savings rate input (AA24=rows[23][26]), Apps Script config (AA26=rows[25][26])
  d.monthlyIncome = num((rows[23]||[])[26]);   // AA24: monthly net income
  d.scriptUrl     = ((rows[25]||[])[26]||'').trim(); // AA26: Apps Script web app URL
  // AI summary written back by Apps Script (AB21=rows[20][27], AB22=rows[21][27])
  d.aiSummary     = ((rows[20]||[])[27]||'').trim(); // AB21
  d.aiSummaryDate = ((rows[21]||[])[27]||'').trim(); // AB22

  // Real estate (rows 39-42)
  const re = rows[39] || [], nw = rows[40] || [], di = rows[41] || [], ds = rows[42] || [];
  const mRnd = v => '¥' + Math.round(v / 1000000) + 'M';
  d.mortgage        = num(nw[3]);
  d.realEstateValue = d.tiers[5].amount + d.mortgage;
  d.annualIncome    = num(di[3]);
  d.ltv       = { result: re[4]||'', actual: pct(re[4]), target: '<70%',  eq: `${mRnd(num(re[2])*10000)} ÷ ${mRnd(num(re[3])*10000)}` };
  d.nwCoverage= { result: nw[4]||'', actual: pct(nw[4]), target: '>50%',  eq: `${mRnd(num(nw[2]))} ÷ ${mRnd(num(nw[3]))}` };
  d.debtIncome= { result: di[4]||'', val: parseFloat((di[4]||'').replace('x','')||0), target: '<6x',    eq: `${mRnd(num(di[2]))} ÷ ${mRnd(num(di[3]))}` };
  d.dscr      = { result: ds[4]||'', val: parseFloat((ds[4]||'').replace('x','')||0), target: '<30%',   eq: `${mRnd(num(ds[2]))} ÷ ${mRnd(num(ds[3]))}` };

  // Holdings (rows 81–119)
  d.holdings = [];
  for (let i = 81; i < Math.min(rows.length, 121); i++) {
    const r = rows[i];
    if (!r || !r[1] || !r[2] || !r[3]) continue;
    if (!r[1].match(/^T[0-9]/)) continue;
    const val = num(r[4]);
    const profit = num(r[5]);
    d.holdings.push({
      id: r[1], tier: r[2], name: r[3],
      value: val, profit, profitPct: pct(r[6]),
      shorthand: r[7] || r[3],
      costBasis: val - profit,
      colorCode: parseInt(r[9]) || 0,
    });
  }
  d.totalGain = d.holdings.reduce((s, h) => s + h.profit, 0);

  // Sectors (rows 47, 49, 51, 53, 55, 57, 59, 61 → indices)
  d.sectors = [];
  for (let i = 47; i <= 62; i += 2) {
    const r = rows[i] || [];
    if (!r[0] || isNaN(parseInt(r[0]))) continue;
    d.sectors.push({ name: r[1] || '', alloc: pct(r[2]), dividend: pct(r[3]) });
  }

  // Dividend yield
  d.dividendYield = pct((rows[16] || [])[11]);

  // YTD gain, total gain, passive income — from portfolio new row 12 (0-indexed)
  const pf13 = (pfRows && pfRows[12] ? pfRows[12] : []).filter(c => c.trim() !== '');
  // non-empty values: [0]=totalNW, [1]=totalNW, [2]=NFA-mortgage, [3]=NFA, [4]=YTD, [5]=totalGain, [6]=passiveIncome
  d.ytdGain             = num(pf13[4] || '0');
  d.totalGain           = num(pf13[5] || '0');
  const piStr           = pf13[6] || '';
  const piParts         = piStr.split('/');
  d.passiveIncomeActual = num(piParts[0] || '0') || 524004;
  d.passiveIncomeTarget = num(piParts[1] || '0') || PASSIVE_INCOME_TARGET;

  return d;
}

// ── Render helpers ────────────────────────────────────────────────────────────
function colorClass(val) { return val > 0 ? 'gain' : val < 0 ? 'loss' : 'neutral'; }
function sign(val) { return val > 0 ? '+' : ''; }
function trafficLight(actual, target, higherIsBad) {
  return (higherIsBad ? actual > target : actual < target) ? 'bad' : 'ok';
}

// ── Main render ───────────────────────────────────────────────────────────────
function render(d) {
  const now = new Date();
  const dateStr = now.toLocaleDateString('ja-JP', { year:'numeric', month:'long', day:'numeric' });
  const incomePct = Math.min(100, Math.round(d.passiveIncomeActual / d.passiveIncomeTarget * 100));

  // Sort + pagination state
  let sortKey = 'profit', sortDir = -1, page = 0;
  const PAGE_SIZE = 10;

  function sortedHoldings() {
    return [...d.holdings].sort((a, b) => {
      let va = a[sortKey], vb = b[sortKey];
      if (typeof va === 'string') return va.localeCompare(vb, 'ja') * sortDir;
      return (va - vb) * sortDir;
    });
  }

  function holdingsRows() {
    const all = sortedHoldings();
    const slice = all.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);
    return slice.map(h => `
      <tr>
        <td><span class="tier-badge ${tierColorClass(h.tier)}">${h.tier}</span></td>
        <td title="${h.name}">${h.shorthand}</td>
        <td>${fmt(h.value)}</td>
        <td>${fmt(h.costBasis)}</td>
        <td class="${colorClass(h.profit)}">${sign(h.profit)}${fmt(h.profit)}</td>
        <td class="${colorClass(h.profitPct)}" style="font-weight:600">${sign(h.profitPct)}${h.profitPct.toFixed(0)}%</td>
      </tr>`).join('');
  }

  function paginationBar() {
    const total = sortedHoldings().length;
    const totalPages = Math.ceil(total / PAGE_SIZE);
    const start = page * PAGE_SIZE + 1;
    const end = Math.min((page + 1) * PAGE_SIZE, total);
    return `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 10px 0;flex-wrap:wrap;gap:8px">
        <span style="font-size:12px;color:var(--muted)">${start}–${end} / ${total}銘柄</span>
        <div style="display:flex;gap:6px">
          <button class="btn" id="prevBtn" ${page === 0 ? 'disabled' : ''} style="padding:4px 12px;font-size:12px">← 前</button>
          <span style="font-size:12px;color:var(--muted);align-self:center">${page + 1} / ${totalPages}</span>
          <button class="btn" id="nextBtn" ${page >= totalPages - 1 ? 'disabled' : ''} style="padding:4px 12px;font-size:12px">次 →</button>
        </div>
      </div>`;
  }

  function holdingsTable() {
    const cols = [
      { key:'tier',      label:'Tier' },
      { key:'shorthand', label:'銘柄' },
      { key:'value',     label:'時価' },
      { key:'costBasis', label:'簿価' },
      { key:'profit',    label:'損益' },
      { key:'profitPct', label:'損益率' },
    ];
    const ths = cols.map(c => {
      const cls = sortKey === c.key ? (sortDir === 1 ? 'sort-asc' : 'sort-desc') : '';
      return `<th class="${cls}" data-key="${c.key}">${c.label}</th>`;
    }).join('');
    return `
      <div class="card" style="padding:0;overflow:visible">
        ${paginationBar()}
        <div class="holdings-wrap" style="margin-top:8px">
          <table class="holdings-table" id="htable">
            <thead><tr>${ths}</tr></thead>
            <tbody id="htbody">${holdingsRows()}</tbody>
            <tfoot><tr>
              <td colspan="2">合計 (${d.holdings.length}銘柄)</td>
              <td>${fmt(d.holdings.reduce((s,h) => s+h.value, 0))}</td>
              <td>${fmt(d.holdings.reduce((s,h) => s+h.costBasis, 0))}</td>
              <td class="${colorClass(d.totalGain)}">${sign(d.totalGain)}${fmt(d.totalGain)}</td>
              <td></td>
            </tr></tfoot>
          </table>
        </div>
        ${paginationBar()}
      </div>`;
  }


  const html = `
    <div class="header">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div class="header-title">
          <img src="icon-192.png" alt="WealthTrack">
          WealthTrack
        </div>
        <div class="tabs">
          <button class="tab active" id="tabDash">Dashboard</button>
          <button class="tab" id="tabProj">Projection</button>
        </div>
      </div>
      <div class="header-meta">
        <span class="badge">USD/JPY ${d.exchangeRate.toFixed(2)}</span>
        <span class="badge">${dateStr}</span>
        <button class="btn" id="refreshBtn">↻ 更新</button>
      </div>
    </div>
    <div id="dashboard-content"></div>
    <div id="projection" style="display:none"></div>`;

  const mainHtml = `

    <!-- Row 1: summary metrics -->
    ${(()=>{
      const nfaMinusMortgage = d.netFinancialAssets - d.mortgage;
      // YoY: find history row ~365 days ago
      const _cutoff = new Date(Date.now() - 365*24*60*60*1000);
      const _oldRows = (_history||[]).filter(r=>r.date<=_cutoff);
      const _yoyHtml = (() => {
        if (!_oldRows.length) return '';
        const o = _oldRows[_oldRows.length-1];
        const oldNW = (o.t1_index_value||0)+(o.t2_value||0)+(o.t3a_ideco_value||0)+
                      (o.t4_land||0)+(o.t4_building||0)-(o.t4_mortgage||0)+
                      (o.t0_value||0)+(o.t1_gold||0)+(o.t1_hysa||0)+(o.t3a_insurance||0)+(o.t3b_value||0);
        const delta = d.totalNetWorth - oldNW;
        const pct   = oldNW ? (delta/oldNW*100) : 0;
        return `<div class="top-metric">
          <div class="top-metric-title">前年同期比</div>
          <div class="top-metric-value ${colorClass(delta)}">${sign(delta)}${fmt(delta)}<span style="font-size:11px;font-weight:400;color:var(--muted)"> (${pct>=0?'+':''}${pct.toFixed(1)}%)</span></div>
        </div>`;
      })();

      return `
      <div class="top-metrics">
        <div class="top-metric">
          <div class="top-metric-title">純資産合計</div>
          <div class="top-metric-value">${fmt(d.totalNetWorth)}</div>
        </div>
        <div class="top-metric">
          <div class="top-metric-title">純金融資産 - 住宅ローン</div>
          <div class="top-metric-value loss">${fmt(nfaMinusMortgage)}</div>
        </div>
        <div class="top-metric">
          <div class="top-metric-title">純金融資産</div>
          <div class="top-metric-value gain">${fmt(d.netFinancialAssets)}</div>
        </div>
        <div class="top-metric">
          <div class="top-metric-title">YTD損益</div>
          <div class="top-metric-value ${colorClass(d.ytdGain)}">${sign(d.ytdGain)}${fmt(d.ytdGain)}</div>
        </div>
        <div class="top-metric">
          <div class="top-metric-title">全体損益</div>
          <div class="top-metric-value ${colorClass(d.totalGain)}">${sign(d.totalGain)}${fmt(d.totalGain)}<span style="font-size:11px;font-weight:400;color:var(--muted)"> (${(()=>{const c=d.netFinancialAssets-d.totalGain;return c>0?(d.totalGain/c*100).toFixed(1):'0';})()}%)</span></div>
        </div>
        <div class="top-metric">
          <div class="top-metric-title">年間パッシブ収入（実績/目標）</div>
          <div class="top-metric-value">${fmt(d.passiveIncomeActual)} / ${fmt(d.passiveIncomeTarget)}</div>
        </div>
        ${_yoyHtml}
      </div>

      <!-- FIRE progress -->
      <div id="fireBarContainer"></div>

      <!-- NW Milestone -->
      <div id="milestoneContainer"></div>

      <!-- History chart -->
      <div id="historyChartContainer"></div>

      <!-- Savings rate -->
      <div id="savingsRateContainer"></div>

      <!-- Annual contribution summary -->
      <div id="annualContribContainer"></div>

      <!-- MoM snapshot (above AI summary) -->
      <div id="aiMomContainer"></div>

      <!-- AI Summary -->
      <div id="aiSummaryContainer"></div>

      <!-- Monthly waterfall -->
      <div id="waterfallContainer"></div>

      <!-- Passive income history -->
      <div id="passiveIncomeContainer"></div>

      `;
    })()}

    <!-- Asset Tiers -->
    <h2>資産 Tier</h2>
    ${(()=>{
      const _cs = getComputedStyle(document.documentElement);
      const DC = {
        T0:     _cs.getPropertyValue('--tier-t0').trim(),
        T1:     _cs.getPropertyValue('--tier-t1').trim(),
        T2:     _cs.getPropertyValue('--tier-t2').trim(),
        'T3(a)':_cs.getPropertyValue('--tier-t3a').trim(),
        'T3(b)':_cs.getPropertyValue('--tier-t3b').trim(),
        T4:     _cs.getPropertyValue('--tier-t4').trim(),
      };
      const dtotal = d.tiers.reduce((s,t)=>s+Math.max(0,t.amount),0)||1;
      const R=54,CX=70,CY=70,SW=24,C=2*Math.PI*R;
      let segs='',doff=0;
      for(const t of d.tiers){
        const len=Math.max(0,t.amount)/dtotal*C;
        if(len<0.5){doff+=len;continue;}
        segs+=`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${DC[t.id]||'#555'}" stroke-width="${SW}" stroke-linecap="butt" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-doff+C/4).toFixed(2)}" transform="rotate(-90 ${CX} ${CY})"/>`;
        doff+=len;
      }
      const donutLegend = d.tiers.map(t=>`<div style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)"><span style="width:8px;height:8px;border-radius:2px;background:${DC[t.id]||'#555'};flex-shrink:0;display:inline-block"></span><span>${t.id}</span><span style="color:var(--text);font-variant-numeric:tabular-nums">${t.pctStr}</span></div>`).join('');
      return `<div class="card" style="padding:0;display:flex;align-items:stretch;overflow:hidden">
        <div style="overflow-x:auto;flex:1;min-width:0">
          <table class="tier-table">
            <thead><tr>
              <th>Tier</th><th>カテゴリ</th><th>資産種別</th>
              <th style="text-align:right">金額</th>
            </tr></thead>
            <tbody>
              ${d.tiers.map(t=>`
              <tr>
                <td><span class="tier-badge ${t.color}">${t.id}</span></td>
                <td>${t.desc}</td>
                <td style="color:var(--muted);font-size:12px">${t.types}</td>
                <td style="text-align:right;font-variant-numeric:tabular-nums">${fmt(t.amount)}</td>
              </tr>`).join('')}
            </tbody>
            <tfoot>
              <tr>
                <td colspan="3" style="font-weight:700">合計</td>
                <td style="text-align:right;font-variant-numeric:tabular-nums">${fmt(d.totalNetWorth)}</td>
              </tr>
            </tfoot>
          </table>
        </div>
        <div style="border-left:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 20px;flex-shrink:0;gap:10px">
          <svg viewBox="0 0 140 140" width="120" height="120" style="display:block">
            <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="${SW}"/>
            ${segs}
          </svg>
          <div style="display:flex;flex-direction:column;gap:5px">${donutLegend}</div>
        </div>
      </div>`;
    })()}

    <!-- Leverage & Real Estate -->
    ${(()=>{
      function lc(metric) {
        if (metric === 'ltv')  return d.ltv.actual > 80       ? 'lev-red'    : d.ltv.actual > 70       ? 'lev-yellow' : 'lev-green';
        if (metric === 'nw')   return d.nwCoverage.actual < 35 ? 'lev-red'   : d.nwCoverage.actual < 50 ? 'lev-yellow' : 'lev-green';
        if (metric === 'di')   return d.debtIncome.val > 7     ? 'lev-red'   : d.debtIncome.val >= 5    ? 'lev-yellow' : 'lev-green';
        if (metric === 'dscr') return d.dscr.val >= 35          ? 'lev-red'   : d.dscr.val >= 30         ? 'lev-yellow' : 'lev-green';
      }
      function levCard(title, eq, actual, target, metric) {
        const cls = lc(metric);
        const tint = 'lev-tint-' + cls.replace('lev-', '');
        return `
          <div class="lev-card ${tint}">
            <div class="lev-title">${title}</div>
            <div class="lev-eq">${eq}</div>
            <div class="lev-body">
              <div class="lev-actual ${cls}">${actual}</div>
              <div class="lev-target-col">
                <div class="lev-target-label">目標</div>
                <div class="lev-target-val ${cls}">${target}</div>
              </div>
            </div>
          </div>`;
      }
      return `
      <h2>レバレッジ健全性</h2>
      <div class="leverage-grid">
        ${levCard('LTV（自己持分）',     d.ltv.eq,        d.ltv.result,        d.ltv.target,        'ltv')}
        ${levCard('純資産カバー率',       d.nwCoverage.eq, d.nwCoverage.result, d.nwCoverage.target, 'nw')}
        ${levCard('総責務÷年収',         d.debtIncome.eq, d.debtIncome.result, d.debtIncome.target, 'di')}
        ${levCard('返済比率（額面ベース）', d.dscr.eq,      d.dscr.result,       d.dscr.target,       'dscr')}
      </div>`;
    })()}

    <!-- Mortgage simulator -->
    <div id="mortgageSimContainer"></div>

    <!-- Scorecard -->
    <h2>スコアカード</h2>
    ${(()=>{
      const sc = d.scorecard;
      function scColor(rawVal, passFn, warnFn, isNum) {
        const v = isNum ? num(rawVal) : pct(rawVal);
        if (passFn(v)) return 'sc-green';
        if (warnFn && warnFn(v)) return 'sc-yellow';
        return 'sc-red';
      }
      function scRow(label, target, display, cls) {
        return `<tr><td>${label}</td><td style="color:var(--muted)">${target}</td><td class="${cls}">${display}</td></tr>`;
      }
      const fmtMOne = v => '¥' + (v/1000000).toFixed(1) + 'M';
      const s0 = sc[0]||{}, s1 = sc[1]||{}, s2 = sc[2]||{}, s3 = sc[3]||{},
            s4 = sc[4]||{}, s5 = sc[5]||{}, s6 = sc[6]||{};
      return `
      <div class="card" style="padding:0;overflow-x:auto">
        <table class="sc-table">
          <thead><tr><th>項目</th><th>目標</th><th>実績</th></tr></thead>
          <tbody>
            <tr class="sc-section"><td colspan="3">──  運用資産（T1 + T2）割合  ──</td></tr>
            ${scRow('コア比率 (T1%)',      '>60%',   s0.rawVal||'', scColor(s0.rawVal||'', v=>v>=60, v=>v>=50, false))}
            ${scRow('分散度 (投信%)',      '>40%',   s1.rawVal||'', scColor(s1.rawVal||'', v=>v>=40, v=>v>=30, false))}
            ${scRow('集中度 (個別株%)',    '<40%',   s2.rawVal||'', scColor(s2.rawVal||'', v=>v<40,  v=>v<50,  false))}
            ${scRow('銘柄上限',            '<10%',   s3.rawVal||'', scColor(s3.rawVal||'', v=>v<10,  v=>v<12,  false))}
            ${scRow('銘柄上限（RSU除く）', '<5.0%',  '0.0%',        'sc-green')}
            <tr class="sc-section"><td colspan="3">──  配当周り・ガードレール  ──</td></tr>
            ${scRow('生活防衛資金（T0）',      '¥4.0M', fmtMOne(num(s4.rawVal||'0')), scColor(s4.rawVal||'0', v=>v>=4000000, v=>v>=3000000, true))}
            ${scRow('現金比率（HYSA÷T1）', '<30%',   s5.rawVal||'', scColor(s5.rawVal||'', v=>v<30,  v=>v<35,  false))}
            ${scRow('配当利回り',           '>2.5%',  s6.rawVal||'', scColor(s6.rawVal||'', v=>v>=2.5,v=>v>=2,  false))}
            <tr class="sc-section"><td colspan="3">──  NISA関係  ──</td></tr>
            ${scRow('2026年投資枠', '¥36M', d.nisa2026.pctStr, 'sc-yellow')}
            ${scRow('生涯投資枠',   '¥18M', d.nisaLife.pctStr,  'sc-yellow')}
          </tbody>
        </table>
      </div>`;
    })()}

    <!-- Sector Allocation -->
    <h2>セクター配分</h2>
    <div class="card">
      ${d.sectors.map(s => `
      <div class="sector-row">
        <div class="sector-name">${s.name}</div>
        <div class="sector-bar-bg">
          <div class="sector-bar-fill" style="width:${Math.min(100, s.alloc * 5)}%;background:${s.alloc >= 15 ? 'var(--red)' : s.alloc >= 13 ? 'var(--yellow)' : 'var(--green)'}"></div>
        </div>
        <div class="sector-pct">${s.alloc.toFixed(1)}%</div>
      </div>`).join('')}
    </div>

    <!-- Holdings -->
    <h2>保有銘柄一覧</h2>
    ${holdingsTable()}

    <div style="height:32px"></div>
  `;

  document.getElementById('dashboard').innerHTML = html;
  document.getElementById('dashboard-content').innerHTML = mainHtml;
  renderFireBar(d, document.getElementById('fireBarContainer'));
  const _waterfallData = buildWaterfallData(_history);
  const _rates = _history.length >= 2 ? computeRates(_history) : null;
  renderMilestones(d, _waterfallData, _rates, document.getElementById('milestoneContainer'));
  renderHistoryChart(_history, document.getElementById('historyChartContainer'));
  renderSavingsRate(d, _waterfallData, document.getElementById('savingsRateContainer'));
  renderAnnualContrib(_history, document.getElementById('annualContribContainer'));
  renderMoMSnapshot(d, _waterfallData, document.getElementById('aiMomContainer'));
  renderAISummary(d, _waterfallData, document.getElementById('aiSummaryContainer'));
  renderWaterfallChart(_history, document.getElementById('waterfallContainer'));
  renderPassiveIncomeChart(_history, d, document.getElementById('passiveIncomeContainer'));
  renderMortgageSimulator(d, document.getElementById('mortgageSimContainer'));

  // Tab switching
  document.getElementById('tabDash').addEventListener('click', () => {
    document.getElementById('dashboard-content').style.display='block';
    document.getElementById('projection').style.display='none';
    document.getElementById('tabDash').classList.add('active');
    document.getElementById('tabProj').classList.remove('active');
  });
  document.getElementById('tabProj').addEventListener('click', () => {
    document.getElementById('dashboard-content').style.display='none';
    document.getElementById('projection').style.display='block';
    document.getElementById('tabDash').classList.remove('active');
    document.getElementById('tabProj').classList.add('active');
  });

  renderProjection(d, _history, _rates);

  function bindHoldingsEvents() {
    // Sort
    document.getElementById('htable').querySelector('thead').addEventListener('click', e => {
      const th = e.target.closest('th');
      if (!th || !th.dataset.key) return;
      if (sortKey === th.dataset.key) sortDir *= -1;
      else { sortKey = th.dataset.key; sortDir = 1; page = 0; }
      rebuildHoldings();
    });
    // Pagination
    document.getElementById('dashboard').addEventListener('click', e => {
      if (e.target.id === 'prevBtn' && page > 0) { page--; rebuildHoldings(); }
      if (e.target.id === 'nextBtn') { page++; rebuildHoldings(); }
    });
  }

  function rebuildHoldings() {
    const wrap = document.getElementById('htable').closest('.card');
    wrap.innerHTML = `
      ${paginationBar()}
      <div class="holdings-wrap" style="margin-top:8px">
        <table class="holdings-table" id="htable">
          <thead><tr>${
            [['tier','Tier'],['shorthand','銘柄'],['value','時価'],['costBasis','簿価'],['profit','損益'],['profitPct','損益率']]
            .map(([key,label]) => {
              const cls = sortKey === key ? (sortDir===1?'sort-asc':'sort-desc') : '';
              return `<th class="${cls}" data-key="${key}">${label}</th>`;
            }).join('')
          }</tr></thead>
          <tbody id="htbody">${holdingsRows()}</tbody>
          <tfoot><tr>
            <td colspan="2">合計 (${d.holdings.length}銘柄)</td>
            <td>${fmt(d.holdings.reduce((s,h)=>s+h.value,0))}</td>
            <td>${fmt(d.holdings.reduce((s,h)=>s+h.costBasis,0))}</td>
            <td class="${colorClass(d.totalGain)}">${sign(d.totalGain)}${fmt(d.totalGain)}</td>
            <td></td>
          </tr></tfoot>
        </table>
      </div>
      ${paginationBar()}`;
  }

  bindHoldingsEvents();

  // Refresh button
  document.getElementById('refreshBtn').addEventListener('click', () => loadAndRender());
}

function tierColorClass(tier) {
  const map = { 'T0':'t0','T1':'t1','T2':'t2','T3 (a)':'t3a','T3(a)':'t3a','T3 (b)':'t3b','T3(b)':'t3b','T4':'t4' };
  return map[tier] || 't0';
}

// ── Load & render ─────────────────────────────────────────────────────────────
async function loadAndRender() {
  const loadEl = document.getElementById('loading');
  const dashEl = document.getElementById('dashboard');
  const btn = document.getElementById('refreshBtn');
  if (btn) btn.disabled = true;
  loadEl.style.display = 'block';
  loadEl.textContent = 'データ読み込み中...';
  dashEl.style.display = 'none';
  try {
    const [cleanRes, pfRes, histRes] = await Promise.all([fetch(CLEAN_URL), fetch(PORTFOLIO_URL), fetch(HISTORY_URL)]);
    if (!cleanRes.ok) throw new Error(`HTTP ${cleanRes.status}`);
    const [cleanText, pfText, histText] = await Promise.all([cleanRes.text(), pfRes.text(), histRes.ok ? histRes.text() : Promise.resolve('')]);
    const data = extract(parseCSV(cleanText), parseCSV(pfText));
    _history = histText ? parseHistory(parseCSV(histText)) : [];
    loadEl.style.display = 'none';
    dashEl.style.display = 'block';
    render(data);
  } catch (err) {
    loadEl.innerHTML = `<div class="error-box">⚠️ データの読み込みに失敗しました: ${err.message}<br>スプレッドシートが公開設定になっているか確認してください。</div>`;
  }
}

loadAndRender();
</script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body>
